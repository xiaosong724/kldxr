plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xiuxian.game'
    compileSdk 34

    /* ★★★ 2026-10-24（用户："名字要区分开，不然不知道哪个是本地哪个是服务器"）★★★
       → 两个 flavor：local（连局域网）/ cloud（连 43.138.171.250）
         · applicationId 不同 ✗ 两个版本可以【同时装在一台手机上】✓ 不会互相覆盖 ✓
         · app 名字不同（桌面图标下面写的不一样 ✓ 一眼就分得清 ✓）
         · GAME_URL 不同（见 MainActivity 里的 BuildConfig 判断 ✓）
       ★ 为什么用 flavor 而不是编译两次改源码：
         改源码很容易忘了改回来 ✗ 一不留神把云端地址打进本地包 ✓
         flavor 是【构建期定死】的 ✗ 永远不会搞混 ✓✓
    */
    flavorDimensions 'server'
    productFlavors {
        local {
            dimension 'server'
            applicationId "com.xiuxian.game"
            resValue "string", "app_name", "修仙·本地服"
            buildConfigField "String", "SERVER_URL", '"http://192.168.31.180:8899/"'
        }
        cloud {
            dimension 'server'
            applicationId "com.xiuxian.game.cloud"
            resValue "string", "app_name", "修仙·云端服"
            buildConfigField "String", "SERVER_URL", '"http://43.138.171.250:8899/"'
        }
    }

    defaultConfig {
        applicationId "com.xiuxian.game"
        minSdk 23                 // Android 6.0+（WebView 够新 ✓ 覆盖面够广 ✓）
        targetSdk 34
        versionCode 3
        // 局域网自适应包（横竖屏 + 192.168.31.180）
        versionName "0.1.3"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // 试玩阶段先不混淆（出问题好查 ✓ 正式发布再开）
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // ★ 一个第三方依赖都没有 —— 纯 Android 原生 WebView 壳
    //   为什么：依赖越少，编译越不容易出问题，包也越小 ✓
}
