plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    signingConfigs {
        lan {
            storeFile file('../test-release.jks')
            storePassword 'testrelease'
            keyAlias 'test'
            keyPassword 'testrelease'
        }
    }
    namespace 'com.xiuxian.game.test'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiuxian.game.test"
        minSdk 23                 // Android 6.0+（WebView 够新 ✓ 覆盖面够广 ✓）
        targetSdk 34
        versionCode 4
        // 局域网自适应包（APK 原生强制横屏 + 页面按钮可切竖屏）
        versionName "0.1.3-测试服"
    }

    buildTypes {
        release {
            // 试玩阶段先不混淆（出问题好查 ✓ 正式发布再开）
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.lan
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // ★ 一个第三方依赖都没有 —— 纯 Android 原生 WebView 壳
    //   为什么：依赖越少，编译越不容易出问题，包也越小 ✓
}
