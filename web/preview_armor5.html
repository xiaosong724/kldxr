<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>防具图标 · 立体版（同轮廓三种装饰）</title>
<style>
  body{background:#141a22;color:#e8eef6;font:14px/1.6 -apple-system,"Microsoft YaHei",sans-serif;
       margin:0;padding:16px}
  h1{font-size:17px;margin:0 0 2px}
  .tip{opacity:.75;font-size:12px;margin-bottom:12px;line-height:1.7}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card{background:#1b2430;border:1px solid #ffffff22;border-radius:12px;padding:12px;text-align:center}
  .zoom{width:150px;height:150px;margin:0 auto 4px;display:block;image-rendering:auto}
  .row3{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:8px 0 6px}
  .s{display:flex;flex-direction:column;align-items:center;gap:4px}
  .s i{font-style:normal;font-size:10px;opacity:.55}
  .slot{position:relative;width:44px;height:44px;border-radius:8px;border:1px solid #ffffff33;
        display:flex;align-items:center;justify-content:center}
  .slot svg{width:32px;height:32px}
  .tg{position:absolute;left:2px;top:0;font-size:11px;font-weight:700;color:#9aa4b2}
  .nm{font-weight:700;font-size:13px}
  .ds{opacity:.7;font-size:11px;line-height:1.45;margin-top:2px}
  .c1{color:#b9a6ff} .c2{color:#8ee0ff} .c3{color:#ffd83d}
</style>
</head>
<body>
<h1>防具图标 · 立体版（同一个好轮廓 + 三种装饰程度）</h1>
<div class="tip">
  ★ 之前几版的问题是：<b>平面单色 + 黑线</b> → 看着像"标志"，不像盔甲 ✗<br>
  ★ 这一版换成：<b>亮面 + 暗面 + 描边 + 领口</b>（领口是关键 —— 有领口才像"穿的东西"✓）<br>
  ★ 左大图是<b>放大 4 倍</b>的效果（看清细节）· 右边三种尺寸是真实使用场景 ✓
</div>
<div class="grid" id="grid"></div>
<script>
/* 同一个"正经胸甲"轮廓（有领口 + 肩甲 + 收腰 + 下摆），三种装饰程度 */
function plate(extra) {
  return '<path d="M4.4 4.4 c-2.1 0.7 -3.5 2.3 -3.7 4.6 l-0.1 3.4 c0 1.5 1.2 2.7 2.7 2.8 l0.6 -6.4 z"' +
    ' fill="currentColor" stroke="#000" stroke-opacity=".45" stroke-width=".7" stroke-linejoin="round"/>' +
    '<path d="M19.6 4.4 c2.1 0.7 3.5 2.3 3.7 4.6 l0.1 3.4 c0 1.5 -1.2 2.7 -2.7 2.8 l-0.6 -6.4 z"' +
    ' fill="currentColor" stroke="#000" stroke-opacity=".45" stroke-width=".7" stroke-linejoin="round"/>' +
    '<path d="M8.2 3.2 c1.2 1.1 2.4 1.6 3.8 1.6 s2.6 -0.5 3.8 -1.6 l3.8 1.9 -0.8 4.8 -1.9 -0.6 0.6 7.6' +
    ' c0 0.7 -0.5 1.2 -1.2 1.2 H7.7 c-0.7 0 -1.2 -0.5 -1.2 -1.2 l0.6 -7.6 -1.9 0.6 -0.8 -4.8 z"' +
    ' fill="currentColor" stroke="#000" stroke-opacity=".5" stroke-width=".85" stroke-linejoin="round"/>' +
    '<path d="M12 4.8 v14.1 h4.5 c0.7 0 1.2 -0.5 1.2 -1.2 l-0.6 -7.6 1.9 0.6 0.8 -4.8 -3.8 -1.9' +
    ' c-1.2 1.1 -2.4 1.6 -3.8 1.6 z" fill="#000" opacity=".2"/>' +
    '<path d="M8.6 5 l2.6 1.3 -0.5 12.6 -1.7 0 z" fill="#fff" opacity=".16"/>' +
    '<path d="M12 5.6 v13.3" stroke="#000" stroke-opacity=".34" stroke-width=".9"/>' +
    '<path d="M8.3 3.3 c1.2 1.1 2.4 1.6 3.7 1.6 s2.5 -0.5 3.7 -1.6"' +
    ' stroke="#000" stroke-opacity=".5" stroke-width="1.05" fill="none"/>' + (extra || '');
}
var C = {
  A: { n: '① 素甲', c: 'c1', d: '只有结构，不加装饰。最干净、缩放最稳', svg: plate(
      '<path d="M7.4 14.4 h9.2 v1.8 H7.4 z" fill="#000" opacity=".22"/>') },
  B: { n: '② 铆钉甲', c: 'c2', d: '腰带 + 四颗铆钉 + 胸口一颗大钉', svg: plate(
      '<path d="M7.4 14.4 h9.2 v1.8 H7.4 z" fill="#000" opacity=".22"/>' +
      '<circle cx="12" cy="10.2" r="1.5" fill="#000" opacity=".26"/>' +
      '<circle cx="12" cy="10.2" r="0.7" fill="#fff" opacity=".22"/>' +
      '<circle cx="8.5" cy="7.2" r="0.62" fill="#000" opacity=".3"/>' +
      '<circle cx="15.5" cy="7.2" r="0.62" fill="#000" opacity=".3"/>' +
      '<circle cx="8.9" cy="17.5" r="0.55" fill="#000" opacity=".3"/>' +
      '<circle cx="15.1" cy="17.5" r="0.55" fill="#000" opacity=".3"/>') },
  C: { n: '③ 高领符文甲', c: 'c3', d: '立起来的高领 + 金色符线。最有"法宝"味', svg: plate(
      '<path d="M9 2.4 c1 0.9 2 1.3 3 1.3 s2 -0.4 3 -1.3 l0.7 1.1 c-1.2 1 -2.4 1.5 -3.7 1.5 s-2.5 -0.5 -3.7 -1.5 z"' +
      ' fill="currentColor" stroke="#000" stroke-opacity=".5" stroke-width=".8"/>' +
      '<path d="M7.4 14.4 h9.2 v1.8 H7.4 z" fill="#000" opacity=".22"/>' +
      '<path d="M12 7.6 l1.9 2.5 -1.9 2.5 -1.9 -2.5 z" fill="#000" opacity=".24"/>' +
      '<path d="M12 6.4 v-1.6 M12 13.4 v1.4" stroke="#000" stroke-opacity=".3" stroke-width=".9"/>' +
      '<circle cx="12" cy="10.1" r="0.75" fill="#000" opacity=".32"/>') }
};
(function () {
  var out = [];
  for (var k in C) {
    var v = C[k];
    out.push('<div class="card">' +
      '<svg class="zoom ' + v.c + '" viewBox="0 0 24 24">' + v.svg + '</svg>' +
      '<div class="row3">' +
      '<div class="s"><svg class="' + v.c + '" width="64" height="64" viewBox="0 0 24 24">' + v.svg + '</svg><i>64px</i></div>' +
      '<div class="s"><svg class="' + v.c + '" width="40" height="40" viewBox="0 0 24 24">' + v.svg + '</svg><i>40px</i></div>' +
      '<div class="s"><div class="slot"><span class="tg">3</span>' +
      '<svg class="' + v.c + '" style="opacity:.6" viewBox="0 0 24 24">' + v.svg + '</svg></div><i>背包低阶</i></div>' +
      '<div class="s"><div class="slot" style="background:linear-gradient(180deg,#8a7a6655,#8a7a6622)">' +
      '<span class="tg">12</span>' +
      '<svg class="' + v.c + '" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 4px currentColor)">' +
      v.svg + '</svg></div><i>背包高阶</i></div>' +
      '</div>' +
      '<div class="nm ' + v.c + '">' + v.n + '</div>' +
      '<div class="ds">' + v.d + '</div></div>');
  }
  document.getElementById('grid').innerHTML = out.join('');
})();
</script>
</body>
</html>
