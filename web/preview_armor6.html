<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>防具图标 · 三个方向</title>
<style>
  body{background:#141a22;color:#e8eef6;font:14px/1.6 -apple-system,"Microsoft YaHei",sans-serif;
       margin:0;padding:16px}
  h1{font-size:17px;margin:0 0 2px}
  .tip{opacity:.75;font-size:12px;margin-bottom:12px;line-height:1.7}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card{background:#1b2430;border:1px solid #ffffff22;border-radius:12px;padding:12px;text-align:center}
  .zoom{width:140px;height:140px;margin:0 auto 6px;display:block}
  .row3{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:6px 0}
  .s{display:flex;flex-direction:column;align-items:center;gap:4px}
  .s i{font-style:normal;font-size:10px;opacity:.5}
  .slot{position:relative;width:44px;height:44px;border-radius:8px;border:1px solid #ffffff33;
        display:flex;align-items:center;justify-content:center}
  .slot svg{width:32px;height:32px}
  .tg{position:absolute;left:2px;top:0;font-size:11px;font-weight:700;color:#9aa4b2}
  .nm{font-weight:700;font-size:13px}
  .ds{opacity:.75;font-size:11px;line-height:1.5;margin-top:3px;text-align:left}
  .c1{color:#b9a6ff} .c2{color:#8ee0ff} .c3{color:#ffd83d}
</style>
</head>
<body>
<h1>防具图标 · 换三个「画法方向」（不是换形状）</h1>
<div class="tip">
  ★ 我前面五版都是一个路子：<b>平涂 + 描边</b> → 结果怎么看都像衣服 ✗（因为有袖子、有布领口）<br>
  ★ 这一版给你三个<b>根本不同的方向</b>，你指一个方向，我在那个方向上做到好 ✓
</div>
<div class="grid" id="grid"></div>
<script>
/* ============ 方向一：像素画（经典 RPG 那种小图）============
   16×16 网格，4 个色阶（描边/暗/中/亮）✓
   像素画的优势：缩到 32px 反而更清楚 ✓ 而且"是盔甲"这件事没有歧义 ✓ */
function px(map, pal) {
  var out = '', y, x, ch;
  for (y = 0; y < map.length; y++) {
    for (x = 0; x < map[y].length; x++) {
      ch = map[y][x];
      if (ch === '.') { continue; }
      out += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' +
        (pal[ch] || 'currentColor') + '"/>';
    }
  }
  return out;
}
var PX_ARMOR = [
  '................',
  '....########....',
  '...##aaaaaa##...',
  '..##aabbbbaa##..',
  '.##aabbbbbbaa##.',
  '##aabbbbbbbbaa##',
  '##abbbbbbbbbba##',
  '##abbbbccbbbbba#',
  '.#abbbbccbbbbba#',
  '.#abbbbbbbbbbba#',
  '.#aabbbbbbbbaa##',
  '..#aabbbbbbaa##.',
  '..#aa#####aa##..',
  '...##aaaaa##....',
  '....#######.....',
  '................'
];
var PX_HELM = [
  '................',
  '.....######.....',
  '...##########...',
  '..############..',
  '.##aaabbbaaa###.',
  '##aaabbbbbaaa###',
  '##aabbbbbbbbaa##',
  '##aacc##ccbbaa##',
  '##aacc##ccbbaa##',
  '##aabbbbbbbbaa##',
  '.##abbbbbbbba##.',
  '.##aabbbbbbaa##.',
  '..##aaaaaaa###..',
  '...##aaaaa###...',
  '....#######.....',
  '................'
];
/* ============ 方向二：头盔 + 胸甲（头盔一眼就是盔甲 ✓ 最保险）============ */
var HELM_CUIRASS =
  '<path d="M12 1.6 c-2.9 0 -4.9 2 -4.9 5 v3.1 h9.8 V6.6 c0 -3 -2 -5 -4.9 -5 z"' +
  ' fill="currentColor" stroke="#000" stroke-opacity=".5" stroke-width=".8"/>' +
  '<path d="M12 1.6 c-2.9 0 -4.9 2 -4.9 5 v3.1 h2.1 V6.8 c0 -2.6 1 -4.3 2.8 -4.3 z" fill="#fff" opacity=".16"/>' +
  '<path d="M12 5.4 v8.6 h4.9 V6.6 c0 -0.5 -0.1 -1 -0.2 -1.4 z" fill="#000" opacity=".22"/>' +
  '<path d="M8.3 5.2 h7.4 v1.3 H8.3 z M8.3 7.6 h3.1 v1.1 H8.3 z M12.6 7.6 h3.1 v1.1 h-3.1 z"' +
  ' fill="#000" opacity=".38"/>' +
  '<path d="M12 2.2 v3" stroke="#000" stroke-opacity=".3" stroke-width=".8"/>' +
  '<path d="M6.8 10.4 c-1.5 0.3 -2.6 1.4 -2.9 3 l-0.2 2.6 h3.1 z M17.2 10.4 c1.5 0.3 2.6 1.4 2.9 3' +
  ' l0.2 2.6 h-3.1 z" fill="currentColor" stroke="#000" stroke-opacity=".45" stroke-width=".7"/>' +
  '<path d="M9 11 h6 v1.6 H9 z M8.4 13.2 h7.2 v4.2 H8.4 z" fill="currentColor"' +
  ' stroke="#000" stroke-opacity=".5" stroke-width=".8"/>' +
  '<path d="M12 13.4 v3.8" stroke="#000" stroke-opacity=".34" stroke-width=".8"/>' +
  '<path d="M10.2 11.2 l-1 1.2 -1 -1.2 z M13.8 11.2 l1 1.2 1 -1.2 z" fill="#000" opacity=".28"/>';
/* ============ 方向三：纯几何板甲（只留斜切面，不要任何曲线 ✓ 最"硬"）============ */
var GEO =
  '<path d="M4.6 4.2 L9 2.2 h1.4 v18.6 H6.6 L3.4 8.4 z" fill="currentColor" opacity=".95"/>' +
  '<path d="M19.4 4.2 L15 2.2 h-1.4 v18.6 h3.8 l3.2 -12.4 z" fill="currentColor" opacity=".72"/>' +
  '<path d="M12.6 2.2 h2.4 l3.4 2 -0.6 4.4 -2.8 -0.8 v13 h-2.4 z" fill="#000" opacity=".16"/>' +
  '<path d="M12 2.6 v18" stroke="#000" stroke-opacity=".45" stroke-width=".9"/>' +
  '<path d="M4.6 4.2 L12 8.6 L19.4 4.2" stroke="#000" stroke-opacity=".4" stroke-width=".9" fill="none"/>' +
  '<path d="M6 10.4 h12 M6.6 13.2 h10.8" stroke="#000" stroke-opacity=".3" stroke-width=".9"/>' +
  '<path d="M3.4 8.4 L12 12.2 L20.6 8.4" stroke="#fff" stroke-opacity=".18" stroke-width=".9" fill="none"/>';
var DIRS = {
  A: { n: '方向一：像素画', c: 'c1', d: '16×16 像素网格，4 个色阶。<b>缩到 32px 反而最清楚</b>，' +
      '"这是盔甲"没有歧义 ✓ 怀旧 RPG 味。缺点：和现在游戏里的 3D 风格不一样', svg: null },
  B: { n: '方向二：头盔 + 胸甲', c: 'c2', d: '<b>头盔是"一眼就是盔甲"最保险的元素</b> ✓ ' +
      '加上胸甲和肩甲，整体是"一套装备"✓ 仍然走平涂+描边（和游戏风格统一 ✓）', svg: HELM_CUIRASS },
  C: { n: '方向三：纯几何板甲', c: 'c3', d: '不要任何曲线 ✗ 全是斜切面和直边 ✓ ' +
      '锐利、硬、像"符箓金属片"✓ 缩小后是一块<b>菱形轮廓</b>，辨识度高 ✓', svg: GEO }
};
(function () {
  var out = [];
  for (var k in DIRS) {
    var v = DIRS[k], body;
    if (k === 'A') {
      body = '<svg class="zoom ' + v.c + '" viewBox="0 0 16 16" shape-rendering="crispEdges">' +
        px(PX_ARMOR, { '#': '#00000066', a: 'currentColor', b: 'currentColor', c: '#ffffff44' }) +
        '</svg>';
    } else {
      body = '<svg class="zoom ' + v.c + '" viewBox="0 0 24 24">' + v.svg + '</svg>';
    }
    out.push('<div class="card">' + body + '<div class="row3">' +
      '<div class="s">' + (k === 'A'
        ? '<svg class="' + v.c + '" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">' +
          px(PX_ARMOR, { '#': '#00000066', a: 'currentColor', b: 'currentColor', c: '#ffffff44' }) + '</svg>'
        : '<svg class="' + v.c + '" width="64" height="64" viewBox="0 0 24 24">' + v.svg + '</svg>') +
      '<i>64px</i></div>' +
      '<div class="s"><div class="slot"><span class="tg">12</span>' +
      (k === 'A'
        ? '<svg class="' + v.c + '" viewBox="0 0 16 16" shape-rendering="crispEdges">' +
          px(PX_ARMOR, { '#': '#00000066', a: 'currentColor', b: 'currentColor', c: '#ffffff44' }) + '</svg>'
        : '<svg class="' + v.c + '" viewBox="0 0 24 24">' + v.svg + '</svg>') +
      '</div><i>背包真实大小</i></div></div>' +
      '<div class="nm ' + v.c + '">' + v.n + '</div>' +
      '<div class="ds">' + v.d + '</div></div>');
  }
  document.getElementById('grid').innerHTML = out.join('');
  /* 方向一额外画一个头盔像素图当参考 ✓ */
})();
</script>
</body>
</html>
