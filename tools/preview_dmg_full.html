<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>战斗飘字 · 全类型预览（B 金属切割）</title>
<style>
  html,body{margin:0;height:100%;background:#14171c;overflow:hidden;
    font-family:system-ui,"Microsoft YaHei",sans-serif}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .want{position:absolute;left:0;top:0;width:100%;height:100%}
  .num{position:absolute;left:0;top:0;pointer-events:none;
    will-change:transform,opacity;white-space:nowrap}
  .tag{position:absolute;color:#6b7684;font-size:12px;font-weight:700;
    letter-spacing:1px;pointer-events:none;text-align:center;width:200px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="want" id="want"></div>

<script>
(function () {
  var cv = document.getElementById('bg'), g = cv.getContext('2d');
  function draw() {
    var W = cv.width = innerWidth, H = cv.height = innerHeight;
    var sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#1b2028'); sky.addColorStop(.55, '#22282f'); sky.addColorStop(1, '#151a1f');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    var gy = H * .62;
    var gr = g.createLinearGradient(0, gy, 0, H);
    gr.addColorStop(0, '#2a3138'); gr.addColorStop(1, '#12161a');
    g.fillStyle = gr; g.fillRect(0, gy, W, H - gy);
    g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = 1;
    for (var i = 0; i < 12; i++) {
      var y = gy + Math.pow(i / 11, 1.7) * (H - gy);
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }
    function mob(cx, cy, s, col) {
      g.fillStyle = col;
      g.beginPath(); g.ellipse(cx, cy, 24 * s, 40 * s, 0, 0, 7); g.fill();
      g.beginPath(); g.arc(cx, cy - 42 * s, 18 * s, 0, 7); g.fill();
    }
    mob(W * .50, gy + 90, 1.35, '#34313a');
    g.fillStyle = '#3a4550';
    g.beginPath(); g.ellipse(W * .50, gy + 150, 22, 36, 0, 0, 7); g.fill();
    g.beginPath(); g.arc(W * .50, gy + 108, 17, 0, 7); g.fill();
    var vg = g.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
  }
  draw(); addEventListener('resize', draw);
})();

var want = document.getElementById('want');
var pool = [], CAP = 80;
function slot() {
  for (var i = 0; i < pool.length; i++) if (!pool[i].busy) return pool[i];
  if (pool.length < CAP) {
    var el = document.createElement('div'); el.className = 'num'; want.appendChild(el);
    var o = { el: el, busy: false }; pool.push(o); return o;
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

document.head.insertAdjacentHTML('beforeend', `
<style>
/* =========================================================
   统一基底：金属渐变 + 双层投影（B 风格）
   各类只改【渐变色 + 描边光 + 字号】
   ========================================================= */
.num{font-weight:900;letter-spacing:.6px;font-style:italic;
  background-clip:text;-webkit-background-clip:text;color:transparent;
  transform-origin:50% 60%}

/* ① 普通攻击：白→金（最轻） */
.tAtk{
  background-image:linear-gradient(180deg,#ffffff 0%,#fff0c0 40%,#ffc65a 64%,#9a5b00 100%);
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.92)) drop-shadow(0 0 9px rgba(255,170,30,.62));
}
/* ② 普攻暴击：白→金→橙（更亮更烫） */
.tAtkC{
  background-image:linear-gradient(180deg,#fffdf0 0%,#ffe066 32%,#ff8f00 68%,#7d2400 100%);
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.95)) drop-shadow(0 0 20px rgba(255,110,0,.95));
}
/* ③ 技能伤害：白→青→蓝（和普攻一眼分得开） */
.tSk{
  background-image:linear-gradient(180deg,#ffffff 0%,#d8f4ff 36%,#4fc3ff 66%,#0b3f6b 100%);
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.92)) drop-shadow(0 0 12px rgba(60,190,255,.75));
}
/* ④ 技能暴击：白→品红→紫（最炸） */
.tSkC{
  background-image:linear-gradient(180deg,#ffffff 0%,#ffd0f6 30%,#ff37c8 64%,#5c0060 100%);
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.95)) drop-shadow(0 0 24px rgba(255,60,200,.95));
}
/* ⑤ 玩家受伤：白→红（带"痛"感，微微抖） */
.tHurt{
  background-image:linear-gradient(180deg,#fff2f2 0%,#ff8a80 34%,#e01a1a 66%,#5a0000 100%);
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.95)) drop-shadow(0 0 14px rgba(255,30,30,.8));
}
/* ⑥ 治疗 / 吸血：白→薄荷绿 */
.tHeal{
  background-image:linear-gradient(180deg,#f4fff6 0%,#a8f5bd 36%,#2ecc71 66%,#0a4a24 100%);
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.9)) drop-shadow(0 0 12px rgba(60,220,120,.72));
}
/* ⑦ 经验 / 突破：白→淡紫蓝 */
.tExp{
  background-image:linear-gradient(180deg,#ffffff 0%,#dbe9ff 36%,#7fb2ff 66%,#123a7a 100%);
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.9)) drop-shadow(0 0 12px rgba(110,160,255,.75));
}
/* ⑧ 武器特效文字（旋击/横扫/连砍/背击…）：白→青绿（不抢伤害数字） */
.tFx{
  background-image:linear-gradient(180deg,#ffffff 0%,#d6fff2 36%,#3ddcb0 66%,#0a5644 100%);
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.88)) drop-shadow(0 0 9px rgba(60,220,180,.55));
  font-style:normal;
}
/* ⑨ 中性提示（击败/复活）：纯白金属 */
.tSys{
  background-image:linear-gradient(180deg,#ffffff 0%,#e9eef5 42%,#a9b6c6 70%,#2b3440 100%);
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.9)) drop-shadow(0 0 8px rgba(200,220,255,.45));
}
</style>`);

var NOW = function () { return performance.now(); };

/* 统一运动：重砸落下 → 上浮淡出
   kind 决定额外细节：crit 多一次闪光、hurt 左右抖、heal 轻微上飘 */
function fly(cls, txt, sx, sy, size, opt) {
  opt = opt || {};
  var o = slot(), el = o.el;
  o.busy = true;
  el.className = 'num ' + cls;
  el.textContent = txt;
  el.style.display = 'block';
  el.style.fontSize = size + 'px';
  el.style.opacity = '1';
  var t0 = NOW(), life = opt.life || 1150;
  var dx = (Math.random() * 18 - 9);
  var shakeX = cls === 'tHurt' ? 1 : 0;
  (function loop() {
    var k = (NOW() - t0) / life;
    if (k >= 1) { o.busy = false; el.style.display = 'none'; return; }
    // 缩放：2.15 → 1（重砸感），crit 再多弹一下
    var s;
    if (k < .12) { s = 2.15 - 9.6 * k; }
    else if (opt.crit && k < .2) { s = 1.0 + .22 * Math.sin((k - .12) / .08 * Math.PI); }
    else { s = 1; }
    // 位移：先微微一沉，再上浮
    var y = sy + (k < .1 ? 6 * (k / .1) : 6) - 62 * (1 - Math.pow(1 - k, 1.9));
    var x = sx + dx * k;
    if (shakeX) { x += Math.sin(k * 46) * 3.2 * (1 - k) * .8; }
    var op = k < .68 ? 1 : 1 - (k - .68) / .32;
    el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + s.toFixed(3) + ')';
    el.style.opacity = String(op);
    requestAnimationFrame(loop);
  })();
}

/* ---------- 演示 ---------- */
var TYPES = [
  { cls: 'tAtk',  txt: '128',        size: 24, name: '① 普通攻击',      crit: false },
  { cls: 'tAtkC', txt: '1,240 暴击', size: 34, name: '② 普攻暴击',      crit: true  },
  { cls: 'tSk',   txt: '3,580',      size: 32, name: '③ 技能伤害',      crit: false },
  { cls: 'tSkC',  txt: '9,860 暴击', size: 42, name: '④ 技能暴击',      crit: true  },
  { cls: 'tHurt', txt: '-356',       size: 28, name: '⑤ 玩家受伤',      crit: false },
  { cls: 'tHeal', txt: '+488',       size: 26, name: '⑥ 治疗 / 吸血',   crit: false },
  { cls: 'tExp',  txt: '经验 +2,400', size: 22, name: '⑦ 经验 / 突破',  crit: false },
  { cls: 'tFx',   txt: '横扫 18m',   size: 22, name: '⑧ 武器特效',      crit: false },
  { cls: 'tSys',  txt: '击败',       size: 26, name: '⑨ 击败 / 复活',   crit: false }
];

function demo() {
  var W = innerWidth, H = innerHeight;
  want.innerHTML = '';
  pool.forEach(function (o) { o.busy = false; o.el.style.display = 'none'; });
  var cols = 3, rows = 3;
  var cw = W / cols;
  TYPES.forEach(function (t, i) {
    var cx = cw * (i % cols) + cw / 2;
    var cy = (H * .30) + (H * .19) * Math.floor(i / cols);
    var tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = t.name;
    tag.style.left = (cx - 100) + 'px';
    tag.style.top = (cy + 92) + 'px';
    want.appendChild(tag);
    setTimeout(function () {
      fly(t.cls, t.txt, cx - 60, cy, t.size, { crit: t.crit });
    }, 60 + i * 90);
  });
  setTimeout(demo, 2700);
}
demo();
</script>
</body>
</html>
