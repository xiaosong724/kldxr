function box(parent, w, h, d, c, x, y, z) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matOf(c));
  m.position.set(x || 0, y || 0, z || 0);
  parent.add(m);
  return m;
}
/* 方台（袍子下摆 / 裙）：四棱台 = 圆柱 4 段转 45° */
function taper(parent, wTop, wBot, h, c, x, y, z) {
  var geo = new THREE.CylinderGeometry(wTop * 0.7071, wBot * 0.7071, h, 4, 1);
  var m = new THREE.Mesh(geo, matOf(c));
  m.rotation.y = Math.PI / 4;
  m.position.set(x || 0, y || 0, z || 0);
  parent.add(m);
  return m;
}

/* ---------------- 搭一个角色（骨架参数化） ---------------- */
function buildChar(ch) {
  var g = new THREE.Group();
  var S = {}; for (var k in DEF) { S[k] = DEF[k]; }
  for (var k2 in (ch.sk || {})) { S[k2] = ch.sk[k2]; }
  var P = ch.pal;

  /* ---- 关键：所有挂点由参数算 ---- */
  var hipY = S.hipY;                                  // 髋 = 腿长（脚在 y=0）
  var torsoBottom = hipY;
  var torsoTop = hipY + S.torsoH;
  var shoulderY = torsoTop - 0.06;
  var headY = torsoTop + S.neck + S.headH / 2 + 0.06; // 头中心
  var handY = -S.armLen;                              // 手（=剑挂点）在手臂末端

  /* 腿：盒高 = hipY，中心在 -hipY/2 → 脚底正好在 0 */
  function limb(x, y, w, h, d, c) {
    var p = new THREE.Group();
    p.position.set(x, y, 0);
    box(p, w, h, d, c, 0, -h / 2, 0);
    g.add(p);
    return p;
  }
  var legL = limb(-S.legW * 0.78, hipY, S.legW, hipY, S.legW, P.pants);
  var legR = limb(S.legW * 0.78, hipY, S.legW, hipY, S.legW, P.pants);
  box(legL, S.legW * 1.2, 0.28, S.legW * 1.5, P.boot, 0, -hipY + 0.14, 0.06);
  box(legR, S.legW * 1.2, 0.28, S.legW * 1.5, P.boot, 0, -hipY + 0.14, 0.06);

  /* 躯干 */
  box(g, S.torsoW, S.torsoH, S.torsoD, P.shirt, 0, hipY + S.torsoH / 2, 0);
  box(g, S.torsoW * 0.42, 0.16, S.torsoD * 1.02, P.collar, 0, torsoTop - 0.06, 0);
  box(g, S.torsoW * 1.02, 0.20, S.torsoD * 1.04, P.belt, 0, hipY + 0.10, 0);
  box(g, 0.20, 0.20, 0.09, P.gold, 0, hipY + 0.10, S.torsoD * 0.52);

  /* 手臂：枢轴在肩，手臂长可变，手在末端 */
  var armL = limb(-S.armX, shoulderY, S.armW, S.armLen, S.armW, P.shirtD);
  var armR = limb(S.armX, shoulderY, S.armW, S.armLen, S.armW, P.shirt);
  box(armL, S.armW * 1.05, 0.20, S.armW * 1.05, P.skin, 0, handY + 0.08, 0);
  box(armR, S.armW * 1.05, 0.20, S.armW * 1.05, P.skin, 0, handY + 0.08, 0);

  /* 头 */
  var headG = new THREE.Group(); headG.position.set(0, headY, 0); g.add(headG);
  box(headG, S.headW, S.headH, S.headD, P.skin, 0, 0, 0);
  var eyeY = S.headH * 0.06, eyeZ = S.headD * 0.52;
  box(headG, 0.20 * (S.headW / 1.1), 0.20, 0.05, P.eye, -S.headW * 0.20, eyeY, eyeZ);
  box(headG, 0.20 * (S.headW / 1.1), 0.20, 0.05, P.eye, S.headW * 0.20, eyeY, eyeZ);
  box(headG, 0.26, 0.07, 0.05, P.mouth, 0, -S.headH * 0.20, eyeZ);

  /* ---- 头发 ---- */
  var hc = P.hair;
  if (ch.hair === 'short' || !ch.hair) {
    box(headG, S.headW * 1.04, 0.26, S.headD * 1.04, hc, 0, S.headH * 0.52, 0);
  } else if (ch.hair === 'messy') {
    box(headG, S.headW * 1.08, 0.24, S.headD * 1.06, hc, 0, S.headH * 0.55, 0);
    box(headG, 0.16, 0.22, 0.16, hc, -S.headW * 0.42, S.headH * 0.66, -0.06);
    box(headG, 0.14, 0.18, 0.14, hc, S.headW * 0.40, S.headH * 0.70, 0.04);
  } else if (ch.hair === 'bald') {
    /* 光头：什么都不加 */
  } else if (ch.hair === 'topknot') {
    box(headG, S.headW * 1.02, 0.22, S.headD * 1.02, hc, 0, S.headH * 0.54, 0);
    box(headG, 0.22, 0.30, 0.22, hc, 0, S.headH * 0.78, -0.06);
  } else if (ch.hair === 'pony' || ch.hair === 'ponyhigh') {
    box(headG, S.headW * 1.04, 0.26, S.headD * 1.04, hc, 0, S.headH * 0.52, 0);
    var py = (ch.hair === 'ponyhigh') ? S.headH * 0.80 : S.headH * 0.36;
    box(headG, 0.20, 0.20, 0.20, hc, 0, py, -S.headD * 0.55);
    box(headG, 0.18, S.headH * 0.95, 0.18, hc, 0, py - S.headH * 0.55, -S.headD * 0.62);
  } else if (ch.hair === 'long') {
    box(headG, S.headW * 1.06, 0.28, S.headD * 1.06, hc, 0, S.headH * 0.52, 0);
    box(headG, S.headW * 1.06, S.headH * 1.55, S.headD * 0.34, hc, 0, -S.headH * 0.60, -S.headD * 0.40);
    box(headG, 0.16, S.headH * 1.0, S.headD * 0.9, hc, -S.headW * 0.54, -S.headH * 0.34, 0);
    box(headG, 0.16, S.headH * 1.0, S.headD * 0.9, hc, S.headW * 0.54, -S.headH * 0.34, 0);
  } else if (ch.hair === 'hood') {
    box(headG, S.headW * 1.16, S.headH * 0.46, S.headD * 1.16, hc, 0, S.headH * 0.46, 0);
    box(headG, 0.20, S.headH * 0.62, S.headD * 0.96, hc, -S.headW * 0.56, S.headH * 0.10, 0);
    box(headG, 0.20, S.headH * 0.62, S.headD * 0.96, hc, S.headW * 0.56, S.headH * 0.10, 0);
  }

  /* ---- 衣服轮廓：裙 / 长袍 / 长外套 ---- */
  if (ch.cloth === 'skirt' && ch.skirt) {
    taper(g, ch.skirt.top, ch.skirt.bot, ch.skirt.len, ch.skirt.c, 0, hipY - ch.skirt.len / 2 + 0.22, 0);
  } else if (ch.cloth === 'robe' && ch.skirt) {
    taper(g, ch.skirt.top, ch.skirt.bot, ch.skirt.len, ch.skirt.c, 0, hipY - ch.skirt.len / 2 + 0.30, 0);
  } else if (ch.cloth === 'longcoat') {
    box(g, S.torsoW * 1.04, 0.90, S.torsoD * 1.06, P.shirtD, 0, hipY - 0.20, 0);
  }

  /* ---- 配件（相对 head / torso / back / arm / 世界） ---- */
  var anchor = {
    head: headG,
    torso: (function () { var t = new THREE.Group(); t.position.set(0, hipY + S.torsoH / 2, 0); g.add(t); return t; })(),
    back: (function () { var t = new THREE.Group(); t.position.set(0, hipY + S.torsoH * 0.45, -S.torsoD * 0.5); g.add(t); return t; })(),
    armL: armL, armR: armR, legL: legL, legR: legR, g: g
  };
  var acc = ch.acc || [];
  for (var i = 0; i < acc.length; i++) {
    var a = acc[i];
    var par = anchor[a.p] || g;
    var m2 = box(par, a.w, a.h, a.d, a.c, a.dx || 0, a.dy || 0, a.dz || 0);
    if (a.rotZ) { m2.rotation.z = a.rotZ; }
    if (a.rotX) { m2.rotation.x = a.rotX; }
  }

  /* 待战姿态（和游戏里一样：手臂微前摆） */
  armL.rotation.x = 0.10; armR.rotation.x = -0.12;
  legL.rotation.x = 0.04; legR.rotation.x = -0.04;

  g.userData.h = headY + S.headH / 2;    // 头顶高度（名字/血条要用）
  return g;
}

/* ---------------- 场景：5 列 × 4 行，脚踩同一条地面线 ---------------- */
var cv = document.getElementById('cv');
var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1500, 1360, false);
renderer.setClearColor(0x0d1016, 1);

var scene = new THREE.Scene();
var COLS = 5, ROWS = 4, SX = 3.5, SY = 3.8;
var VIEW_H = ROWS * SY + 1.5;
var cam = new THREE.OrthographicCamera(-VIEW_H / 2, VIEW_H / 2, VIEW_H / 2, -VIEW_H / 2, 0.1, 200);
cam.position.set(0, 0, 60); cam.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.25));
var d1 = new THREE.DirectionalLight(0xffffff, 0.8); d1.position.set(5, 9, 10); scene.add(d1);
var d2 = new THREE.DirectionalLight(0x99ccff, 0.35); d2.position.set(-9, 4, -6); scene.add(d2);

var heroes = [];
var PREVIEW_S = 0.80;
for (var i = 0; i < CHARS.length; i++) {
  var c2 = i % COLS, r2 = Math.floor(i / COLS);
  var h = buildChar(CHARS[i]);
  h.scale.multiplyScalar(PREVIEW_S);
  /* 脚踩地面：地面线在每格底部 */
  var groundY = ((ROWS - 1) / 2 - r2) * SY - SY / 2 + 0.45;
  h.position.set((c2 - (COLS - 1) / 2) * SX, groundY, 0);
  h.rotation.y = -0.40;
  scene.add(h);
  heroes.push(h);
}

/* ★ 自动取景：按所有角色的实际包围盒算相机 ✗ 不再手调 VIEW_H ✓ */
var bbox = new THREE.Box3();
for (var bi = 0; bi < heroes.length; bi++) { bbox.expandByObject(heroes[bi]); }
bbox.min.y -= 0.85;            /* 底部留一条：放名字 */
var bsize = bbox.getSize(new THREE.Vector3());
var bcen = bbox.getCenter(new THREE.Vector3());
var ASPECT = 1500 / 1360;
var vh = Math.max(bsize.y, bsize.x / ASPECT) * 1.07;
cam.left = -vh * ASPECT / 2; cam.right = vh * ASPECT / 2;
cam.top = vh / 2; cam.bottom = -vh / 2;
cam.position.set(bcen.x, bcen.y, 60);
cam.lookAt(bcen.x, bcen.y, 0);
cam.updateProjectionMatrix();

/* ★ round478：名字挂到【各自脚下】✗ 不再用底部图例 ✓
   做法：把"脚下那一点"投影成屏幕坐标 → 生成绝对定位的标签 ✓
   （角色会绕 Y 轴自转，但脚下点不动 → 标签不会跟着晃 ✓）*/
var labelBox = document.getElementById('labels');
var _pv = null;
function placeLabels() {
  for (var k = 0; k < heroes.length; k++) {
    var hh = heroes[k];
    /* 世界坐标：脚底再往下一点点 */
    var wp = new THREE.Vector3(hh.position.x, hh.position.y - 0.16, 0);
    if (!_pv) { _pv = new THREE.Vector3(); }
    _pv.copy(wp).project(cam);
    var sx = (_pv.x * 0.5 + 0.5) * 1500;
    var sy = (-_pv.y * 0.5 + 0.5) * 1360;
    var el = hh.userData.lb;
    if (!el) {
      el = document.createElement('div');
      el.className = 'lb';
      el.innerHTML = '<b>' + CHARS[k].n + '</b><i>' + CHARS[k].sx + '</i>';
      labelBox.appendChild(el);
      hh.userData.lb = el;
    }
    el.style.left = sx.toFixed(1) + 'px';
    el.style.top = sy.toFixed(1) + 'px';
  }
}
placeLabels();

var t0 = performance.now();
function loop() {
  var t = (performance.now() - t0) / 1000;
  for (var i2 = 0; i2 < heroes.length; i2++) {
    heroes[i2].rotation.y = -0.40 + Math.sin(t * 0.5 + i2 * 0.6) * 0.18;
  }
  renderer.render(scene, cam);
  if (!loop._lb || (performance.now() - loop._lb) > 400) { loop._lb = performance.now(); placeLabels(); }
  requestAnimationFrame(loop);
}
loop();
window.__ready = true;
</script>
