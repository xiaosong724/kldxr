/* ---------------- 搭一个人（同一套骨架，位置和 hero() 一致） ---------------- */
var matCache = {};
function matOf(c) {
  if (matCache[c]) { return matCache[c]; }
  var m = new THREE.MeshLambertMaterial({ color: c });
  matCache[c] = m;
  return m;
}
function buildHero(spec) {
  var g = new THREE.Group();
  var P = spec.pal;
  function put(w, h, d, c, x, y, z, parent) {
    var b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matOf(c));
    b.position.set(x, y, z);
    (parent || g).add(b);
    return b;
  }
  put(1.10, 1.02, 1.02, P.skin, 0, 2.46, 0);
  put(1.14, 0.34, 1.06, P.hair, 0, 2.86, 0);
  put(0.13, 0.40, 0.26, P.hair, -0.53, 2.66, 0.40);
  put(0.13, 0.40, 0.26, P.hair, 0.53, 2.66, 0.40);
  put(0.22, 0.22, 0.06, 0x2a2a2a, -0.23, 2.46, 0.53);
  put(0.22, 0.22, 0.06, 0x2a2a2a, 0.23, 2.46, 0.53);
  put(0.26, 0.06, 0.06, P.hair, -0.23, 2.64, 0.53);
  put(0.26, 0.06, 0.06, P.hair, 0.23, 2.64, 0.53);
  put(0.30, 0.08, 0.06, P.mouth || 0xb0685c, 0, 2.26, 0.53);
  put(1.02, 0.98, 0.62, P.shirt, 0, 1.42, 0);
  put(0.30, 0.16, 0.64, P.collar, 0, 1.86, 0);
  put(1.06, 0.22, 0.66, P.belt, 0, 0.98, 0);
  put(0.22, 0.22, 0.10, P.gold, 0, 0.98, 0.36);
  function limb(c, w, h, d, x, y) {
    var p = new THREE.Group();
    p.position.set(x, y, 0);
    var b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matOf(c));
    b.position.y = -h / 2;
    p.add(b); g.add(p); return p;
  }
  var armL = limb(P.shirtD, 0.30, 0.92, 0.30, -0.66, 1.82);
  var armR = limb(P.shirt, 0.30, 0.92, 0.30, 0.66, 1.82);
  var legL = limb(P.pants, 0.34, 0.92, 0.34, -0.26, 0.86);
  var legR = limb(P.pants, 0.34, 0.92, 0.34, 0.26, 0.86);
  put(0.40, 0.30, 0.52, P.boot, 0, -1.0, 0, legL);
  put(0.40, 0.30, 0.52, P.boot, 0, -1.0, 0, legR);
  put(0.32, 0.22, 0.32, P.skin, 0, -0.98, 0, armL);
  put(0.32, 0.22, 0.32, P.skin, 0, -0.98, 0, armR);
  var map = { g: g, armL: armL, armR: armR, legL: legL, legR: legR };
  for (var i = 0; i < (spec.extra || []).length; i++) {
    var e = spec.extra[i];
    put(e.w, e.h, e.d, e.c, e.x || 0, e.y || 0, e.z || 0, map[e.p] || g);
  }
  g.scale.setScalar(spec.s || 1);
  armL.rotation.x = 0.10; armR.rotation.x = -0.12;
  legL.rotation.x = 0.04; legR.rotation.x = -0.04;
  return g;
}

/* ---------------- 场景（5 列 × 4 行，正方形画布 → 像素不被拉宽） ---------------- */
var cv = document.getElementById('cv');
var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1500, 1500, false);
renderer.setClearColor(0x0d1016, 1);

var scene = new THREE.Scene();
var COLS = 5, ROWS = 4, SX = 3.5, SY = 3.95, VIEW = 17.8;
var cam = new THREE.OrthographicCamera(-VIEW / 2, VIEW / 2, VIEW / 2, -VIEW / 2, 0.1, 200);
cam.position.set(0, 0, 60);
cam.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2));
var d1 = new THREE.DirectionalLight(0xffffff, 0.85); d1.position.set(4, 8, 10); scene.add(d1);
var d2 = new THREE.DirectionalLight(0x99ccff, 0.35); d2.position.set(-8, 4, -6); scene.add(d2);

/* 地面圆盘：去掉（纯色背景更干净） */


var heroes = [];
var PREVIEW_S = 0.88;     /* 预览用缩放：让 4 行都放得下（不改变皮肤本身的 s 比较） */
for (var i = 0; i < SKINS.length; i++) {
  var c2 = i % COLS, r2 = Math.floor(i / COLS);
  var h = buildHero(SKINS[i]);
  h.scale.multiplyScalar(PREVIEW_S);
  h.position.set((c2 - (COLS - 1) / 2) * SX, ((ROWS - 1) / 2 - r2) * SY - 1.75, 0);
  h.rotation.y = -0.42;
  scene.add(h);
  heroes.push(h);
}

var lg = document.getElementById('legend');
var html = '';
for (var k = 0; k < SKINS.length; k++) {
  html += '<div><b>' + (k + 1) + '</b> ' + SKINS[k].n + '</div>';
}
lg.innerHTML = html;

var t0 = performance.now();
function loop() {
  var t = (performance.now() - t0) / 1000;
  for (var i2 = 0; i2 < heroes.length; i2++) {
    heroes[i2].rotation.y = -0.42 + Math.sin(t * 0.55 + i2 * 0.7) * 0.20;
  }
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();
window.__ready = true;
