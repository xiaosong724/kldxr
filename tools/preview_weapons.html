<script src="../web/lib/three.min.js"></script>
<script>
/* ★ 方块尺寸、光照全部照 web/core/game.js 的 hero()/mob() 来 —— 你看到的就是真做出来的样子 ✓
   真做的时候：server 的武器表给 look id → core/game.js 里一张 WEAPON_LOOKS 表出模型 ✓ */

var MAT = {
  steel: 0xd8f0f4, steelD: 0x9aa8b0, dark: 0x4a5058, wood: 0x6a4a2a, woodD: 0x4a3218,
  gold: 0xe0bc60, iron: 0x7e7e92, rust: 0x8a6a52, wrap: 0x3a3a40, bone: 0xd8d0be,
  glow: 0x8ee6ff, red: 0xc04030
};

/* ---- 每种武器：一组方块 [宽, 高, 深, 颜色, x, y, z] （y 向上 = 从握把往刀尖长 ✓）---- */
function W(name, S, dmg, reach, arc, note, parts, hold) {
  return { name: name, S: S, dmg: dmg, reach: reach, arc: arc, note: note,
           parts: parts, hold: hold || 0.0 };
}
/* ★ 每个方块格式：[宽, 高, 厚, 颜色, x, y, z, 旋转角(可选)]
   第 8 个数是【绕 Z 轴自己转的角度】—— 有了它才能做出：
     斧头的楔形（阶梯式收窄 ✓）、刀的弧线（多段渐进旋转 ✓）、弓的反曲（两端外翻 ✓）
   之前只有轴对齐方块 ✗ 所以斧头就是个"方块贴方块"、刀就是根弯棍子 —— 用户说不像 ✗ */
/* ★★ 单刀的刃：沿一个圆摆 N 段（每段用自己的切线角）★★
   为什么这样写：手摆的话段与段之间会有缝 → 看着像断开的方块链 ✗（上一版就是这样被否的）
   按圆算 + 每段长度 ×1.06 微重叠 → 连成一条连续的弧 ✓
   ★ 刃口（亮色）放在【外弧】那侧 —— 单刃刀的辨识度全靠这条 ✓ */
function saberParts() {
  var R = 2.80, T = 0.60, N = 9, y0 = 0.30;   // ★ 弧度收平缓（0.86→0.60）：中国单刀是微弧，不是弯刀 ✗
  var out = [
    [0.14, 0.10, 0.14, MAT.gold, 0, -0.26, 0],            // 圆首
    [0.07, 0.26, 0.05, MAT.red, 0.10, -0.38, 0],          // 刀穗（三节，长一点更显眼 ✓）
    [0.06, 0.20, 0.05, MAT.red, 0.15, -0.60, 0],
    [0.05, 0.14, 0.04, MAT.red, 0.19, -0.78, 0],
    [0.14, 0.38, 0.13, MAT.wrap, 0, -0.02, 0],            // 握把（比剑长 ✓）
    [0.48, 0.09, 0.48, MAT.gold, 0, 0.24, 0, null, null, 1]  // ★ 圆盘护手（真圆盘 + 金色，显眼 ✓）
  ];
  for (var i = 0; i < N; i++) {
    var t0 = T * i / N, t1 = T * (i + 1) / N, tm = (t0 + t1) / 2;
    var len = R * (t1 - t0) * 1.08;                        // ★ 微重叠 → 无缝 ✓
    var px = R * (1 - Math.cos(tm)), py = y0 + R * Math.sin(tm);
    var w = 0.18 + 0.06 * (i / (N - 1));                   // ★ 刃更宽（0.18 → 0.24 ✓）刀头再加宽一点
    out.push([w, len, 0.055, MAT.steel, px, py, 0, -tm]);
    // 刃口：沿【外弧】方向偏出去一点点（偏移量要跟着切线一起转 ✓ 不然会歪 ✗）
    var off = w * 0.44;
    out.push([w * 0.26, len, 0.045, 0xf4ffff,
              px - off * Math.cos(tm), py + off * Math.sin(tm), 0, -tm]);
  }
  // 刀尖（顺着最后一段的切线往外 ✓）
  var te = T, pex = R * (1 - Math.cos(te)), pey = y0 + R * Math.sin(te);
  out.push([0.13, 0.22, 0.05, 0xf4ffff,
            pex + 0.10 * Math.sin(te), pey + 0.10 * Math.cos(te), 0, -te]);
  return out;
}

/* 圆盘护手（中国刀的标志）用低面数圆柱 —— 还是原型体，不加任何贴图 ✓ */
function discGuard(cy) {
  return [];                                   // 占位（真做的时候用 CylinderGeometry 生成 ✓）
}
var WEAPONS = [
  /* 匕首：宽根 → 收尖 + 十字护手 + 圆尾 ✓ 一眼是短兵器 */
  W('匕首 dagger', 1.45, 0.72, 1.8, 1.20, '贴脸连击 · 最快', [
    [0.11, 0.26, 0.11, MAT.wrap, 0, 0.00, 0],
    [0.15, 0.08, 0.15, MAT.gold, 0, -0.16, 0],          // 尾
    [0.32, 0.07, 0.11, MAT.iron, 0, 0.17, 0],           // 护手（横向，比刃宽 ✓）
    [0.15, 0.30, 0.06, MAT.steel, 0, 0.36, 0],          // 刃根最宽
    [0.12, 0.26, 0.05, MAT.steel, 0, 0.62, 0],
    [0.07, 0.20, 0.05, 0xf4ffff, 0, 0.83, 0]            // 收尖
  ]),
  /* 单手剑：直刃【有收窄】+ 宽护手 + 圆首 ✓ */
  W('单手剑 sword', 1.15, 1.00, 2.4, 1.05, '基准线 · 直刃收尖', [
    [0.18, 0.10, 0.18, MAT.gold, 0, -0.20, 0],          // 圆首
    [0.12, 0.34, 0.12, MAT.woodD, 0, -0.02, 0],
    [0.48, 0.10, 0.16, MAT.iron, 0, 0.19, 0],           // 护手
    [0.16, 0.62, 0.07, MAT.steel, 0, 0.52, 0],          // 根部宽
    [0.13, 0.44, 0.06, MAT.steel, 0, 1.05, 0],
    [0.09, 0.26, 0.05, 0xf4ffff, 0, 1.40, 0]            // 剑尖
  ]),
  /* ★★ 刀（用户说"不像"，重做第二版）★★
     上一版两个毛病：① 刃的 6 段是【手摆】的 → 段与段有缝，看着像一串断方块 ✗
                     ② 刃太窄 ✗ 不像单刀
     这一版：按【同一个圆】算出每段的位置和切线角 → 首尾微重叠、绝不留缝 ✓
             + 刃口放在【外弧】那侧（单刃刀的标志 ✓）+ 刀头加宽 ✓ + 真的圆盘护手 ✓ */
  W('刀 saber', 1.20, 0.95, 2.3, 1.15, '圆弧刃 + 单边开刃 + 圆盘护手 + 刀穗',
    saberParts()),
  W('长棍 staff', 1.05, 1.02, 2.9, 1.00, '两端铁箍 · 均衡', [
    [0.10, 2.20, 0.10, MAT.wood, 0, 0.94, 0],
    [0.15, 0.12, 0.15, MAT.iron, 0, 2.02, 0],           // 铁箍
    [0.15, 0.12, 0.15, MAT.iron, 0, -0.14, 0],
    [0.14, 0.36, 0.14, MAT.wrap, 0, 0.10, 0]            // 握把缠绳
  ]),
  W('长枪 spear', 1.00, 1.05, 3.6, 0.70, '叶形枪头 + 红缨', [
    [0.09, 2.20, 0.09, MAT.wood, 0, 0.96, 0],
    [0.14, 0.36, 0.14, MAT.wrap, 0, 0.10, 0],
    [0.16, 0.12, 0.16, MAT.red, 0, 2.14, 0],            // 红缨 ✓
    [0.15, 0.12, 0.15, MAT.iron, 0, 2.32, 0],           // 枪头下的箍
    [0.22, 0.30, 0.06, MAT.steel, 0, 2.52, 0],          // 叶形根（宽 ✓）
    [0.14, 0.26, 0.05, MAT.steel, 0, 2.78, 0],
    [0.08, 0.22, 0.05, 0xf4ffff, 0, 3.00, 0]            // 枪尖
  ]),
  /* ★ 双手斧（用户说"不像"）：关键是【阶梯楔形】—— 越往外越矮 → 三角形 ✓ 而且是双刃 ✓ */
  W('双手斧 axe', 0.75, 1.45, 3.0, 1.55, '双刃 · 阶梯楔形斧头', [
    [0.22, 0.12, 0.22, MAT.iron, 0, -0.24, 0],          // 尾
    [0.18, 0.40, 0.18, MAT.wrap, 0, 0.12, 0],           // 握把
    [0.14, 1.90, 0.14, MAT.wood, 0, 0.92, 0],
    [0.30, 0.34, 0.30, MAT.dark, 0, 1.60, 0],           // ★ 头部套筒
    // 右刃：4 段阶梯收窄（高度 0.86 → 0.62 → 0.42 → 0.26 ✓）→ 三角形 ✓
    [0.22, 0.86, 0.14, MAT.iron, 0.22, 1.60, 0],
    [0.24, 0.62, 0.13, MAT.iron, 0.40, 1.60, 0],
    [0.18, 0.42, 0.12, MAT.iron, 0.54, 1.60, 0],
    [0.09, 0.26, 0.11, 0xf4ffff, 0.66, 1.60, 0],        // 刃口（亮 ✓）
    // 左刃：镜像 ✓
    [0.22, 0.86, 0.14, MAT.iron, -0.22, 1.60, 0],
    [0.24, 0.62, 0.13, MAT.iron, -0.40, 1.60, 0],
    [0.18, 0.42, 0.12, MAT.iron, -0.54, 1.60, 0],
    [0.09, 0.26, 0.11, 0xf4ffff, -0.66, 1.60, 0]
  ]),
  W('锤 hammer', 0.72, 1.60, 2.8, 1.30, '大铁块 + 亮打击面', [
    [0.20, 0.12, 0.20, MAT.iron, 0, -0.22, 0],
    [0.17, 0.36, 0.17, MAT.wrap, 0, 0.12, 0],
    [0.13, 1.60, 0.13, MAT.woodD, 0, 0.80, 0],
    [0.28, 0.26, 0.28, MAT.iron, 0, 1.50, 0],           // 套筒
    [0.72, 0.64, 0.64, MAT.dark, 0, 1.76, 0],           // ★ 大铁块
    [0.84, 0.12, 0.66, MAT.iron, 0, 1.76, 0],           // 勒带
    [0.10, 0.54, 0.54, MAT.steel, 0.42, 1.76, 0],       // ★ 打击面（亮 ✓）
    [0.10, 0.54, 0.54, MAT.steel, -0.42, 1.76, 0]
  ]),
  /* 弓：★ 反曲 —— 两端用旋转段往外翻 ✓ 中间是弦 ✓ */
  W('弓 bow', 0.85, 0.60, 14, 0, '反曲弓 · P3 做投射物', [
    [0.15, 0.42, 0.13, MAT.wrap, 0, 1.00, 0],           // 握把
    [0.10, 0.36, 0.09, MAT.wood, 0.06, 1.36, 0, -0.20], // 上弓臂（逐段外翻 ✓）
    [0.10, 0.32, 0.09, MAT.wood, 0.20, 1.62, 0, -0.38],
    [0.09, 0.24, 0.08, MAT.wood, 0.40, 1.78, 0, -0.70],
    [0.10, 0.36, 0.09, MAT.wood, 0.06, 0.64, 0,  0.20], // 下弓臂
    [0.10, 0.32, 0.09, MAT.wood, 0.20, 0.38, 0,  0.38],
    [0.09, 0.24, 0.08, MAT.wood, 0.40, 0.22, 0,  0.70],
    [0.04, 1.62, 0.03, 0xe8e8e0, 0.46, 1.00, 0]         // ★ 弓弦（连两端 ✓）
  ])
];
/* ---- 品阶外观：★ 越好的武器越精细 + 会发光（用户要求）----
   做法：一份【基础件】+ 逐档【追加件】—— 不用画 5 个完整模型 ✓
   光效靠 emissive（自发光）+ 一个半透明的外扩方块当光晕 ✓ 不需要任何贴图/粒子 ✓ */
var SWORD_BASE = [
  [0.16, 0.62, 0.07, 0xa8b4bc, 0, 0.52, 0],     // 刃根（宽）
  [0.13, 0.44, 0.06, 0xa8b4bc, 0, 1.05, 0],     // 刃身（收窄 ✓）
  [0.48, 0.10, 0.16, 0x7e7e92, 0, 0.19, 0],     // 宽护手
  [0.12, 0.34, 0.12, 0x5a4a38, 0, -0.02, 0],    // 柄
  [0.18, 0.10, 0.18, 0x3a3a44, 0, -0.20, 0]     // 圆首
];
var TIER_ADD = [
  /* 阶 0-1 锈蚀：只换色（暗、发灰）*/
  { extra: [], body: 0x8a7a66, guard: 0x6a5a4a, grip: 0x4a3a28, glow: 0, name:'阶 0-1 锈蚀', note:'4 块 · 暗、发灰 · 不发光' },
  /* 阶 2-3 精铁：+ 刃口 + 配重 */
  { extra: [[0.08, 0.14, 0.08, 0xc8d8e0, 0, 1.52, 0], [0.14, 0.09, 0.14, 0x9aa8b0, 0, -0.24, 0]],
    body: 0xa8b4bc, guard: 0x8a8a9c, grip: 0x5a4a38, glow: 0, name:'阶 2-3 精铁', note:'6 块 · 干净金属 · 不发光' },
  /* 阶 4-6 玄铁：+ 灵纹 + 缠绳，开始微光 */
  { extra: [[0.08, 0.14, 0.08, 0xc8d8e0, 0, 1.52, 0], [0.14, 0.09, 0.14, 0x9aa8b0, 0, -0.24, 0],
            [0.09, 0.22, 0.13, 0x8ee6ff, 0, 0.62, 0], [0.15, 0.12, 0.15, 0x3a3a44, 0, 0.04, 0]],
    body: 0x7a8a9a, guard: 0x9a9ab0, grip: 0x3a3a44, glow: 0.25, name:'阶 4-6 玄铁', note:'8 块 · 一道灵纹 · 微光' },
  /* 阶 7-9 灵器：+ 护手雕饰 + 双色金属 + 穗 */
  { extra: [[0.08, 0.14, 0.08, 0xd8ecff, 0, 1.52, 0], [0.14, 0.09, 0.14, 0xb8c8d8, 0, -0.24, 0],
            [0.09, 0.22, 0.13, 0x8ee6ff, 0, 0.62, 0], [0.15, 0.12, 0.15, 0x3a3a44, 0, 0.04, 0],
            [0.46, 0.13, 0.20, 0xc8d4e0, 0, 0.14, 0], [0.12, 0.30, 0.12, 0x6a7a8a, 0, -0.06, 0],
            [0.09, 0.24, 0.06, 0xc04030, 0.15, 0.02, 0]],
    body: 0xc0d4e4, guard: 0xd0d0e0, grip: 0x4a4a58, glow: 0.4, name:'阶 7-9 灵器', note:'11 块 · 雕饰/双色 · 自发光 + 轮廓光' },
  /* 阶 10-11 神品：+ 宝石 + 纹路 + 加宽护手，强光 + 光晕 */
  { extra: [[0.08, 0.14, 0.08, 0xffffff, 0, 1.52, 0], [0.14, 0.09, 0.14, 0xffe9a8, 0, -0.24, 0],
            [0.09, 0.24, 0.13, 0xffe9a8, 0, 0.72, 0], [0.09, 0.24, 0.13, 0xffe9a8, 0, 0.44, 0],
            [0.15, 0.12, 0.15, 0x8a6a42, 0, 0.04, 0], [0.52, 0.16, 0.24, 0xe0bc60, 0, 0.14, 0],
            [0.13, 0.32, 0.13, 0x8a6a42, 0, -0.06, 0], [0.10, 0.26, 0.06, 0xc04030, 0.18, 0.02, 0],
            [0.14, 0.14, 0.14, 0x8ee6ff, 0, 0.20, 0.14], [0.12, 0.12, 0.12, 0xffe9a8, 0, 1.34, 0]],
    body: 0xf0e0a8, guard: 0xe0bc60, grip: 0x8a6a42, glow: 0.75, name:'阶 10-11 神品', note:'14 块 · 宝石/纹路 · 自发光 + 轮廓光 + 照亮地面' }
];
/* 把基础件按档改色 + 追加件拼起来 */
var TIERS = [];
for (var ti = 0; ti < TIER_ADD.length; ti++) {
  var d = TIER_ADD[ti];
  var parts = [
    [SWORD_BASE[0][0], SWORD_BASE[0][1], SWORD_BASE[0][2], d.body, 0, SWORD_BASE[0][5], 0],
    [SWORD_BASE[1][0], SWORD_BASE[1][1], SWORD_BASE[1][2], d.guard, 0, SWORD_BASE[1][5], 0],
    [SWORD_BASE[2][0], SWORD_BASE[2][1], SWORD_BASE[2][2], d.grip, 0, SWORD_BASE[2][5], 0],
    [SWORD_BASE[3][0], SWORD_BASE[3][1], SWORD_BASE[3][2], d.guard, 0, SWORD_BASE[3][5], 0]
  ];
  for (var ei = 0; ei < d.extra.length; ei++) { parts.push(d.extra[ei]); }
  TIERS.push({ name: d.name, note: d.note, parts: parts, glow: d.glow });
}
function mkScene(shadowRange) {
  var sc = new THREE.Scene();
  sc.background = new THREE.Color(0x9c917c);
  sc.fog = new THREE.Fog(0x9c917c, 40, 130);
  sc.add(new THREE.HemisphereLight(0xb8b0a0, 0x33302b, 0.6));
  var sun = new THREE.DirectionalLight(0xf5c98a, 0.78);
  sun.position.set(8, 20, 12); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -shadowRange; sun.shadow.camera.right = shadowRange;
  sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
  sc.add(sun);
  return sc;
}
var scene = mkScene(22);

function mkGroup() { return new THREE.Group(); }
function put(g, w, h, d, c, x, y, z, cyl) {
  /* ★ cyl = 圆柱（低面数）——只给"圆盘护手"用 ✓ 还是原型体，不加任何贴图 ✓ */
  var geo = cyl ? new THREE.CylinderGeometry(w / 2, w / 2, h, 14)
                : new THREE.BoxGeometry(w, h, d);
  var m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: c }));
  m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
}
/* 一把武器：斜插在地上（看得出全貌 ✓ 不重叠 ✓） */
function mkWeapon(parts, lean, glow) {
  var g = mkGroup();
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    var m = put(g, p[0], p[1], p[2], p[3], p[4], p[5], p[6], p[9]);
    if (p.length > 7) { m.rotation.z = p[7]; }   // ★ 每块自己的旋转角（做楔形/弧线用 ✓）
    /* ★ 品阶光效：emissive 自发光（越好的武器越亮 ✓）+ 高阶加一个半透明光晕壳 ✓ */
    if (glow > 0) {
      m.material.emissive = new THREE.Color(p[3]);
      m.material.emissiveIntensity = glow * 0.75;
    }
  }
  /* ★★ 发光（重做）★★
     上一版是一个【半透明大方块】罩在外面 ✗ 那必然看起来像玻璃块，不像发光 ✗
     发光要满足两条：① 光【贴着武器自己的轮廓】② 光【照亮周围】
     做法：
       ① 加法混合(AdditiveBlending)的"轮廓壳"——把每一块复制一份、放大一圈、
          只渲染背面(BackSide) → 光就沿着武器形状溢出来 ✓（和描边一个原理）
       ② 一盏点光源 → 地面会真的被照亮一圈 ✓ 这是"在发光"最有力的信号 ✓
       ③ 材质本身的 emissive（自发光）继续保持 ✓ */
  if (glow > 0) {
    var shell = new THREE.Group();
    for (var si = 0; si < g.children.length; si++) {
      var src = g.children[si];
      if (!src.isMesh) { continue; }
      var sm = new THREE.Mesh(src.geometry, new THREE.MeshBasicMaterial({
        color: 0xfff0c0, transparent: true, opacity: 0.22 * glow,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide
      }));
      sm.position.copy(src.position);
      sm.rotation.copy(src.rotation);
      sm.scale.copy(src.scale).multiplyScalar(1.0 + 0.10 * glow);   // 沿形状往外溢一圈 ✓
      shell.add(sm);
    }
    g.add(shell);
    var pl = new THREE.PointLight(0xffe9a8, 2.6 * glow, 5.2);       // ★ 照亮脚下的地 ✓
    pl.position.set(0, 0.9, 0);
    g.add(pl);
  }
  g.rotation.z = lean || -0.26;
  g.rotation.y = -0.5;
  return g;
}
function ground(parent, w, d) {
  var p = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshLambertMaterial({ color: 0x8a7a5e }));
  p.rotation.x = -Math.PI / 2; p.receiveShadow = true; parent.add(p);
}
function shadow(sc, x, z, r) {
  var s = new THREE.Mesh(new THREE.CircleGeometry(r, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2, depthWrite: false }));
  s.rotation.x = -Math.PI / 2; s.position.set(x, 0.01, z); sc.add(s); return s;
}

/* ---- 场景 1：8 种武器 ---- */
var s1 = mkScene(24);
ground(s1, 60, 24);
var SP1 = 1.78, N1 = WEAPONS.length;   // 收紧间距 → 镜头能拉近 ✓
for (var i = 0; i < N1; i++) {
  var g1 = mkWeapon(WEAPONS[i].parts, -0.24 + (i % 2) * 0.1);
  g1.position.set((i - (N1 - 1) / 2) * SP1, 0.05, 0);
  s1.add(g1); shadow(s1, g1.position.x, 0, 0.5);
}

/* ---- 场景 2：4 个品阶 ---- */
var s2 = mkScene(20);
ground(s2, 40, 24);
var SP2 = 3.2, N2 = TIERS.length;
for (var j = 0; j < N2; j++) {
  var g2 = mkWeapon(TIERS[j].parts, -0.22, TIERS[j].glow);
  g2.position.set((j - (N2 - 1) / 2) * SP2, 0.05, 0);
  s2.add(g2); shadow(s2, g2.position.x, 0, 0.5);
}

/* ---- 说明行 ---- */
function capRow(el, items, fn) {
  var row = document.getElementById(el);
  for (var k = 0; k < items.length; k++) {
    var d = document.createElement('div');
    d.className = 'cap';
    d.innerHTML = fn(items[k]);
    row.appendChild(d);
  }
}
capRow('row1', WEAPONS, function (w) {
  return '<b>' + w.name + '</b><i>攻速 ×' + w.S.toFixed(2) + ' · 伤害 ×' + w.dmg.toFixed(2) + '（区间内 roll）' +
    '<br>射程 ' + w.reach + ' 米 · 弧 ' + (w.arc ? w.arc.toFixed(2) : '远程') + '<br>' + w.note + '</i>';
});
capRow('row2', TIERS, function (t) { return '<b>' + t.name + '</b><i>' + t.note + '</i>'; });

/* ---- 渲染 ---- */
function bind(canvasId, sc, h, camZ, lookY) {
  var cv = document.getElementById(canvasId);
  var rd = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  rd.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  rd.shadowMap.enabled = true;
  function draw() {
    var w = cv.clientWidth || 1100;
    rd.setSize(w, h, false);
    cv.style.height = h + 'px';
    var cam = new THREE.PerspectiveCamera(20, w / h, 0.1, 300);
    cam.position.set(0, 2.5, camZ);
    cam.lookAt(0, lookY, 0);
    rd.render(sc, cam);
  }
  window.addEventListener('resize', draw);
  draw();
}
bind('cv1', s1, 430, 17, 1.20);
bind('cv2', s2, 400, 19, 1.10);
