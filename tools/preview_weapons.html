<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>武器样式 · 示意图</title>
<style>
  html,body{margin:0;background:#4e4536;font-family:system-ui,"Microsoft YaHei",sans-serif}
  #head{padding:14px 18px 2px;text-align:center}
  #head h2{margin:0 0 4px;color:#f3ead8;font-size:16px;letter-spacing:1px;text-shadow:0 1px 4px #000}
  #head .sub{color:#ddd2ba;font-size:11.5px;text-shadow:0 1px 3px #000}
  .sec{padding:8px 18px 0;color:#ffd83d;font-size:12.5px;text-shadow:0 1px 4px #000}
  #row1,#row2{display:flex;width:100%}
  #row1 .cap,#row2 .cap{flex:1;text-align:center;color:#f2e8d4;font-size:11.5px;line-height:1.55;
    text-shadow:0 1px 4px #000;padding-bottom:8px}
  #row1 .cap b,#row2 .cap b{display:block;font-size:12.5px;color:#ffe9a8}
  #row1 .cap i,#row2 .cap i{font-style:normal;color:#cfc3aa;font-size:10.5px}
  canvas{display:block;width:100%}
</style>
</head>
<body>
  <div id="head">
    <h2>武器样式 · 示意图（和游戏里同样的方块做法，不加任何贴图素材）</h2>
    <div class="sub">上：8 种武器类型（决定攻速/伤害/范围）　下：同一把剑的 5 档精细度 —— 越好的武器块越多、还会发光（不做 12 套模型）</div>
  </div>
  <div class="sec">① 武器类型 —— 伤害系数在区间内 roll，滚完再夹到 [0.95,1.20]（攻速快的必须单次伤害低，防一把通吃）</div>
  <canvas id="cv1"></canvas>
  <div id="row1"></div>
  <div class="sec">② 品阶外观 —— 12 阶只做 5 档视觉：块数递增 + 微光 → 强光 → 光晕</div>
  <canvas id="cv2"></canvas>
  <div id="row2"></div>

<script src="../web/lib/three.min.js"></script>
<script>
/* ★ 方块尺寸、光照全部照 web/core/game.js 的 hero()/mob() 来 —— 你看到的就是真做出来的样子 ✓
   真做的时候：server 的武器表给 look id → core/game.js 里一张 WEAPON_LOOKS 表出模型 ✓ */

var MAT = {
  steel: 0xd8f0f4, steelD: 0x9aa8b0, dark: 0x4a5058, wood: 0x6a4a2a, woodD: 0x4a3218,
  gold: 0xe0bc60, iron: 0x7e7e92, rust: 0x8a6a52, wrap: 0x3a3a40, bone: 0xd8d0be,
  glow: 0x8ee6ff, red: 0xc04030
};

/* ---- 每种武器：一组方块 [宽, 高, 深, 颜色, x, y, z] （y 向上 = 从握把往刀尖长 ✓）---- */
function W(name, S, dmg, reach, arc, note, parts, hold) {
  return { name: name, S: S, dmg: dmg, reach: reach, arc: arc, note: note,
           parts: parts, hold: hold || 0.0 };
}
var WEAPONS = [
  W('匕首 dagger', 1.45, 0.72, 1.8, 1.20, '贴脸连击 · 最快', [
    [0.09, 0.46, 0.05, MAT.steel, 0, 0.40, 0],
    [0.06, 0.10, 0.05, 0xf4ffff, 0, 0.66, 0],
    [0.22, 0.07, 0.09, MAT.iron, 0, 0.16, 0],
    [0.10, 0.20, 0.10, MAT.wrap, 0, 0.02, 0]
  ]),
  W('单手剑 sword', 1.15, 1.00, 2.4, 1.05, '基准线（现在的默认）', [
    [0.11, 1.30, 0.11, MAT.steel, 0, 0.82, 0],
    [0.08, 0.14, 0.08, 0xf4ffff, 0, 1.52, 0],
    [0.36, 0.11, 0.16, MAT.iron, 0, 0.14, 0],
    [0.13, 0.26, 0.13, MAT.woodD, 0, -0.02, 0],
    [0.16, 0.05, 0.16, MAT.gold, 0, -0.16, 0]
  ]),
  W('刀 saber', 1.20, 0.95, 2.3, 1.15, '略偏挥砍 · 弧更宽', [
    [0.10, 1.18, 0.07, MAT.steel, 0, 0.74, 0],          // 3 段错位 → 假装有弧度 ✓
    [0.10, 0.34, 0.07, MAT.steel, 0.07, 1.46, 0],
    [0.10, 0.26, 0.07, MAT.steel, 0.16, 1.72, 0],
    [0.30, 0.09, 0.13, MAT.iron, 0, 0.12, 0],           // 圆护手
    [0.13, 0.28, 0.13, MAT.wrap, 0, -0.04, 0]
  ]),
  W('长棍 staff', 1.05, 1.02, 2.9, 1.00, '长一点 · 均衡', [
    [0.10, 2.30, 0.10, MAT.wood, 0, 0.90, 0],
    [0.14, 0.10, 0.14, MAT.iron, 0, 2.08, 0],
    [0.14, 0.10, 0.14, MAT.iron, 0, -0.26, 0],
    [0.13, 0.30, 0.13, MAT.wrap, 0, 0.02, 0]
  ]),
  W('长枪 spear', 1.00, 1.05, 3.6, 0.70, '最远 · 弧最窄（戳）', [
    [0.09, 2.60, 0.09, MAT.wood, 0, 1.05, 0],
    [0.16, 0.30, 0.06, MAT.steel, 0, 2.48, 0],          // 枪头
    [0.07, 0.22, 0.05, 0xf4ffff, 0, 2.74, 0],
    [0.22, 0.06, 0.10, MAT.iron, 0, 2.30, 0],
    [0.13, 0.30, 0.13, MAT.wrap, 0, 0.02, 0],
    [0.16, 0.06, 0.16, MAT.red, 0, 2.16, 0]             // 红缨 ✓
  ]),
  W('双手斧 axe', 0.75, 1.45, 3.0, 1.55, '慢 · 横扫一大片', [
    [0.13, 1.90, 0.13, MAT.wood, 0, 0.72, 0],
    [0.52, 0.66, 0.10, MAT.iron, 0.24, 1.62, 0],        // 斧头（扁而宽 ✓）
    [0.16, 0.80, 0.20, MAT.iron, 0.06, 1.62, 0],
    [0.30, 0.10, 0.10, MAT.steel, 0.50, 1.62, 0],       // 刃口
    [0.15, 0.34, 0.15, MAT.wrap, 0, 0.02, 0]
  ]),
  W('锤 hammer', 0.72, 1.60, 2.8, 1.30, '最慢最重 · 一下是一下', [
    [0.13, 1.80, 0.13, MAT.woodD, 0, 0.68, 0],
    [0.62, 0.56, 0.56, MAT.dark, 0, 1.66, 0],           // 大铁块 ✓
    [0.66, 0.16, 0.60, MAT.iron, 0, 1.66, 0],
    [0.20, 0.20, 0.20, MAT.steel, 0, 1.66, 0.36],
    [0.16, 0.36, 0.16, MAT.wrap, 0, 0.04, 0]
  ]),
  W('弓 bow', 0.85, 1.15, 14, 0, '远程（P3 才做投射物）', [
    [0.09, 0.70, 0.09, MAT.wood, 0, 1.04, 0],
    [0.09, 0.52, 0.09, MAT.wood, 0.10, 1.62, 0.02],
    [0.09, 0.52, 0.09, MAT.wood, 0.10, 0.46, 0.02],
    [0.03, 1.66, 0.03, 0xe8e8e0, 0.12, 1.04, 0.02],     // 弓弦
    [0.12, 0.26, 0.12, MAT.wrap, 0.04, 1.04, 0]
  ])
];

/* ---- 品阶外观：★ 越好的武器越精细 + 会发光（用户要求）----
   做法：一份【基础件】+ 逐档【追加件】—— 不用画 5 个完整模型 ✓
   光效靠 emissive（自发光）+ 一个半透明的外扩方块当光晕 ✓ 不需要任何贴图/粒子 ✓ */
var SWORD_BASE = [
  [0.11, 1.30, 0.11, 0xa8b4bc, 0, 0.82, 0],     // 刃
  [0.36, 0.11, 0.16, 0x7e7e92, 0, 0.14, 0],     // 护手
  [0.13, 0.26, 0.13, 0x5a4a38, 0, -0.02, 0],    // 柄
  [0.10, 0.07, 0.10, 0x3a3a44, 0, -0.18, 0]     // 尾
];
var TIER_ADD = [
  /* 阶 0-1 锈蚀：只换色（暗、发灰）*/
  { extra: [], body: 0x8a7a66, guard: 0x6a5a4a, grip: 0x4a3a28, glow: 0, name:'阶 0-1 锈蚀', note:'4 块 · 暗、发灰 · 不发光' },
  /* 阶 2-3 精铁：+ 刃口 + 配重 */
  { extra: [[0.08, 0.14, 0.08, 0xc8d8e0, 0, 1.52, 0], [0.14, 0.09, 0.14, 0x9aa8b0, 0, -0.24, 0]],
    body: 0xa8b4bc, guard: 0x8a8a9c, grip: 0x5a4a38, glow: 0, name:'阶 2-3 精铁', note:'6 块 · 干净金属 · 不发光' },
  /* 阶 4-6 玄铁：+ 灵纹 + 缠绳，开始微光 */
  { extra: [[0.08, 0.14, 0.08, 0xc8d8e0, 0, 1.52, 0], [0.14, 0.09, 0.14, 0x9aa8b0, 0, -0.24, 0],
            [0.09, 0.22, 0.13, 0x8ee6ff, 0, 0.62, 0], [0.15, 0.12, 0.15, 0x3a3a44, 0, 0.04, 0]],
    body: 0x7a8a9a, guard: 0x9a9ab0, grip: 0x3a3a44, glow: 0.25, name:'阶 4-6 玄铁', note:'8 块 · 一道灵纹 · 微光' },
  /* 阶 7-9 灵器：+ 护手雕饰 + 双色金属 + 穗 */
  { extra: [[0.08, 0.14, 0.08, 0xd8ecff, 0, 1.52, 0], [0.14, 0.09, 0.14, 0xb8c8d8, 0, -0.24, 0],
            [0.09, 0.22, 0.13, 0x8ee6ff, 0, 0.62, 0], [0.15, 0.12, 0.15, 0x3a3a44, 0, 0.04, 0],
            [0.46, 0.13, 0.20, 0xc8d4e0, 0, 0.14, 0], [0.12, 0.30, 0.12, 0x6a7a8a, 0, -0.06, 0],
            [0.09, 0.24, 0.06, 0xc04030, 0.15, 0.02, 0]],
    body: 0xc0d4e4, guard: 0xd0d0e0, grip: 0x4a4a58, glow: 0.4, name:'阶 7-9 灵器', note:'11 块 · 雕饰/双色 · 微光+淡光晕' },
  /* 阶 10-11 神品：+ 宝石 + 纹路 + 加宽护手，强光 + 光晕 */
  { extra: [[0.08, 0.14, 0.08, 0xffffff, 0, 1.52, 0], [0.14, 0.09, 0.14, 0xffe9a8, 0, -0.24, 0],
            [0.09, 0.24, 0.13, 0xffe9a8, 0, 0.72, 0], [0.09, 0.24, 0.13, 0xffe9a8, 0, 0.44, 0],
            [0.15, 0.12, 0.15, 0x8a6a42, 0, 0.04, 0], [0.52, 0.16, 0.24, 0xe0bc60, 0, 0.14, 0],
            [0.13, 0.32, 0.13, 0x8a6a42, 0, -0.06, 0], [0.10, 0.26, 0.06, 0xc04030, 0.18, 0.02, 0],
            [0.14, 0.14, 0.14, 0x8ee6ff, 0, 0.20, 0.14], [0.12, 0.12, 0.12, 0xffe9a8, 0, 1.34, 0]],
    body: 0xf0e0a8, guard: 0xe0bc60, grip: 0x8a6a42, glow: 0.75, name:'阶 10-11 神品', note:'14 块 · 宝石/纹路 · 强光+光晕' }
];
/* 把基础件按档改色 + 追加件拼起来 */
var TIERS = [];
for (var ti = 0; ti < TIER_ADD.length; ti++) {
  var d = TIER_ADD[ti];
  var parts = [
    [SWORD_BASE[0][0], SWORD_BASE[0][1], SWORD_BASE[0][2], d.body, 0, SWORD_BASE[0][5], 0],
    [SWORD_BASE[1][0], SWORD_BASE[1][1], SWORD_BASE[1][2], d.guard, 0, SWORD_BASE[1][5], 0],
    [SWORD_BASE[2][0], SWORD_BASE[2][1], SWORD_BASE[2][2], d.grip, 0, SWORD_BASE[2][5], 0],
    [SWORD_BASE[3][0], SWORD_BASE[3][1], SWORD_BASE[3][2], d.guard, 0, SWORD_BASE[3][5], 0]
  ];
  for (var ei = 0; ei < d.extra.length; ei++) { parts.push(d.extra[ei]); }
  TIERS.push({ name: d.name, note: d.note, parts: parts, glow: d.glow });
}
function mkScene(shadowRange) {
  var sc = new THREE.Scene();
  sc.background = new THREE.Color(0x9c917c);
  sc.fog = new THREE.Fog(0x9c917c, 40, 130);
  sc.add(new THREE.HemisphereLight(0xb8b0a0, 0x33302b, 0.6));
  var sun = new THREE.DirectionalLight(0xf5c98a, 0.78);
  sun.position.set(8, 20, 12); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -shadowRange; sun.shadow.camera.right = shadowRange;
  sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
  sc.add(sun);
  return sc;
}
var scene = mkScene(22);

function mkGroup() { return new THREE.Group(); }
function put(g, w, h, d, c, x, y, z) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshLambertMaterial({ color: c }));
  m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
}
/* 一把武器：斜插在地上（看得出全貌 ✓ 不重叠 ✓） */
function mkWeapon(parts, lean, glow) {
  var g = mkGroup();
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    var m = put(g, p[0], p[1], p[2], p[3], p[4], p[5], p[6]);
    /* ★ 品阶光效：emissive 自发光（越好的武器越亮 ✓）+ 高阶加一个半透明光晕壳 ✓ */
    if (glow > 0) {
      m.material.emissive = new THREE.Color(p[3]);
      m.material.emissiveIntensity = glow * 0.55;
    }
  }
  if (glow >= 0.7) {                 // 神品：整把罩一层淡光晕 ✓
    var halo = new THREE.Mesh(new THREE.BoxGeometry(0.62, 1.9, 0.62),
      new THREE.MeshBasicMaterial({ color: 0xffe9a8, transparent: true, opacity: 0.16,
                                    depthWrite: false }));
    halo.position.y = 0.8; g.add(halo);
  }
  g.rotation.z = lean || -0.26;
  g.rotation.y = -0.5;
  return g;
}
function ground(parent, w, d) {
  var p = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({ color: 0x8a7a5e }));
  p.rotation.x = -Math.PI / 2; p.receiveShadow = true; parent.add(p);
}
function shadow(sc, x, z, r) {
  var s = new THREE.Mesh(new THREE.CircleGeometry(r, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2, depthWrite: false }));
  s.rotation.x = -Math.PI / 2; s.position.set(x, 0.01, z); sc.add(s); return s;
}

/* ---- 场景 1：8 种武器 ---- */
var s1 = mkScene(24);
ground(s1, 60, 24);
var SP1 = 1.78, N1 = WEAPONS.length;   // 收紧间距 → 镜头能拉近 ✓
for (var i = 0; i < N1; i++) {
  var g1 = mkWeapon(WEAPONS[i].parts, -0.24 + (i % 2) * 0.1);
  g1.position.set((i - (N1 - 1) / 2) * SP1, 0.05, 0);
  s1.add(g1); shadow(s1, g1.position.x, 0, 0.5);
}

/* ---- 场景 2：4 个品阶 ---- */
var s2 = mkScene(20);
ground(s2, 40, 24);
var SP2 = 2.5, N2 = TIERS.length;
for (var j = 0; j < N2; j++) {
  var g2 = mkWeapon(TIERS[j].parts, -0.22, TIERS[j].glow);
  g2.position.set((j - (N2 - 1) / 2) * SP2, 0.05, 0);
  s2.add(g2); shadow(s2, g2.position.x, 0, 0.5);
}

/* ---- 说明行 ---- */
function capRow(el, items, fn) {
  var row = document.getElementById(el);
  for (var k = 0; k < items.length; k++) {
    var d = document.createElement('div');
    d.className = 'cap';
    d.innerHTML = fn(items[k]);
    row.appendChild(d);
  }
}
capRow('row1', WEAPONS, function (w) {
  return '<b>' + w.name + '</b><i>攻速 ×' + w.S.toFixed(2) + ' · 伤害 ×' + w.dmg.toFixed(2) + '（区间内 roll）' +
    '<br>射程 ' + w.reach + ' 米 · 弧 ' + (w.arc ? w.arc.toFixed(2) : '远程') + '<br>' + w.note + '</i>';
});
capRow('row2', TIERS, function (t) { return '<b>' + t.name + '</b><i>' + t.note + '</i>'; });

/* ---- 渲染 ---- */
function bind(canvasId, sc, h, camZ, lookY) {
  var cv = document.getElementById(canvasId);
  var rd = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  rd.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  rd.shadowMap.enabled = true;
  function draw() {
    var w = cv.clientWidth || 1100;
    rd.setSize(w, h, false);
    cv.style.height = h + 'px';
    var cam = new THREE.PerspectiveCamera(20, w / h, 0.1, 300);
    cam.position.set(0, 2.5, camZ);
    cam.lookAt(0, lookY, 0);
    rd.render(sc, cam);
  }
  window.addEventListener('resize', draw);
  draw();
}
bind('cv1', s1, 430, 17, 1.20);
bind('cv2', s2, 400, 15.5, 1.10);
</script>
</body>
</html>
