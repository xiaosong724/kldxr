rd.shadowMap.enabled = true;

/* 光照照抄游戏（第 30 轮的末日调子）✓ */

sun.position.set(10, 22, 14); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
scene.add(sun);

/* 地面（就是游戏里的干土色）*/

  new THREE.MeshBasicMaterial({ color: 0x8a7a5e }));
gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true;
scene.add(gnd);

/* ---- 造一只僵尸：方块尺寸全部照 game.js 的 mob() ---- */
function mkZombie(C) {
  var g = new THREE.Group();
  function mat(c) { return new THREE.MeshLambertMaterial({ color: c }); }
  function put(w, h2, d, c, x, y, z) {
    var b = new THREE.Mesh(new THREE.BoxGeometry(w, h2, d), mat(c));
    b.position.set(x, y, z); b.castShadow = true; g.add(b); return b;
  }
  var th = C.thick || 1;
  put(1.10, 1.10, 1.10, C.head, 0, 2.25, 0);                 // 头
  put(0.22, 0.22, 0.06, 0x142014, -0.24, 2.30, 0.56);        // 眼
  put(0.22, 0.22, 0.06, 0x142014, 0.24, 2.30, 0.56);
  put(0.34, 0.07, 0.06, 0x233018, -0.24, 2.50, 0.56);        // 眉
  put(0.34, 0.07, 0.06, 0x233018, 0.24, 2.50, 0.56);
  put(0.42, 0.07, 0.06, 0x142014, 0, 2.02, 0.56);            // 嘴
  put(1.00, 1.14, 0.60, C.body, 0, 1.14, 0);                 // 身
  put(1.02, 0.16, 0.62, C.belt || 0x2a2620, 0, 0.76, 0);     // 腰带（职业可以换色 ✓）
  function limb(c, x, isArm) {
    var p = new THREE.Group(); p.position.set(x, isArm ? 1.60 : 0.60, 0);
    if (isArm) { p.rotation.x = -1.35; }
    var b = new THREE.Mesh(new THREE.BoxGeometry(
      (isArm ? 0.28 : 0.32) * th, isArm ? 0.96 : 1.06, (isArm ? 0.28 : 0.32) * th), mat(c));
    b.position.y = isArm ? -0.48 : -0.53; b.castShadow = true; p.add(b); g.add(p); return p;
  }
  limb(C.leg, -0.25 * th, 0); limb(C.leg, 0.25 * th, 0);
  limb(C.limb, -0.64 * th, 1); limb(C.limb, 0.64 * th, 1);
  // 职业挂件
  for (var i = 0; i < (C.add || []).length; i++) {
    var a = C.add[i];
    put(a.w, a.h, a.d, a.c, a.x, a.y, a.z);
  }
  // 影子
  var sh = new THREE.Mesh(new THREE.CircleGeometry(0.75, 18),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = 0.01; g.add(sh);
  g.scale.setScalar(C.scale || 1);
  return g;
}

/* ---- 摆一排 ---- */
var SP = 2.15, N = CLASSES.length;
for (var i = 0; i < N; i++) {
  var z = mkZombie(CLASSES[i]);
  z.position.set((i - (N - 1) / 2) * SP, 0, 0);
  z.rotation.y = -0.22;                 // 稍微侧一点，好看见背后的挂件（餐箱/书包）
  scene.add(z);
}
/* 说明行 */
var row = document.getElementById('row');
for (var j = 0; j < N; j++) {
  var d = document.createElement('div');
  d.className = 'cap';
  d.innerHTML = '<b>' + CLASSES[j].name + '</b><i>' + CLASSES[j].desc + '</i>';
  row.appendChild(d);
}

/* ---- 缩放 + 渲染 ---- */
function fit() {
  var w = document.getElementById('cv').clientWidth || 1000;
  var h = 430;
  rd.setSize(w, h, false);          // false = 别动 CSS，CSS 高度下面自己定 ✓
  cam.aspect = w / h;
  cam.position.set(0, 2.6, 22.5);
  cam.lookAt(0, 1.5, 0);
  cam.updateProjectionMatrix();
  rd.render(scene, cam);
}
window.addEventListener('resize', fit);
document.getElementById('cv').style.height = '430px';
fit();
