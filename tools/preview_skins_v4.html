/* 颜色工具：把颜色调亮/调暗，用来做阴影和高光 */
function shade(hex, k) {
  var r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
  r = Math.max(0, Math.min(255, Math.round(r * k)));
  g = Math.max(0, Math.min(255, Math.round(g * k)));
  b = Math.max(0, Math.min(255, Math.round(b * k)));
  return (r << 16) | (g << 8) | b;
}

/* ---------------- 基础 ---------------- */
var matCache = {};
function matOf(c) {
  if (matCache[c]) { return matCache[c]; }
  matCache[c] = new THREE.MeshLambertMaterial({ color: c });
  return matCache[c];
}
function box(parent, w, h, d, c, x, y, z, rz) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matOf(c));
  m.position.set(x || 0, y || 0, z || 0);
  if (rz) { m.rotation.z = rz; }
  parent.add(m);
  return m;
}
function taper(parent, wTop, wBot, h, c, x, y, z) {
  var m = new THREE.Mesh(new THREE.CylinderGeometry(wTop * 0.7071, wBot * 0.7071, h, 4, 1), matOf(c));
  m.rotation.y = Math.PI / 4;
  m.position.set(x || 0, y || 0, z || 0);
  parent.add(m);
  return m;
}

/* ---------------- 脸（v4：更多细节） ---------------- */
function buildFace(headG, S, P, E) {
  var ew = E.w, eh = E.h;
  var hw = S.headW, hh = S.headH, hd = S.headD;
  var ez = hd * 0.50 + 0.012;
  var eyeX = hw * 0.215, eyeY = hh * 0.02;
  var lashC = 0x241f2a;

  /* 眼窝阴影（让眼睛"陷"进去一点） */
  box(headG, ew * 1.30, eh * 1.25, 0.02, P.skinS, -eyeX, eyeY + eh * 0.06, ez - 0.008);
  box(headG, ew * 1.30, eh * 1.25, 0.02, P.skinS, eyeX, eyeY + eh * 0.06, ez - 0.008);

  for (var s = -1; s <= 1; s += 2) {
    var bx = eyeX * s;
    /* 眼白 */
    box(headG, ew, eh, 0.025, 0xffffff, bx, eyeY, ez);
    /* 虹膜（外深内亮，做一点渐变感）*/
    box(headG, ew * 0.80, eh * 0.80, 0.030, P.iris2, bx, eyeY - eh * 0.04, ez + 0.012);
    box(headG, ew * 0.62, eh * 0.60, 0.034, P.iris, bx, eyeY - eh * 0.02, ez + 0.020);
    /* 瞳孔 */
    box(headG, ew * 0.30, eh * 0.34, 0.038, 0x171219, bx, eyeY - eh * 0.02, ez + 0.030);
    /* 高光：左上大一点 + 右下小一点 */
    box(headG, ew * 0.22, eh * 0.20, 0.042, 0xffffff, bx - ew * 0.17, eyeY + eh * 0.16, ez + 0.044);
    box(headG, ew * 0.11, eh * 0.10, 0.042, 0xffffff, bx + ew * 0.18, eyeY - eh * 0.22, ez + 0.044);
    /* 上睫毛（两段，外侧高一点）*/
    box(headG, ew * 0.60, eh * 0.13, 0.045, lashC, bx - ew * 0.20, eyeY + eh * 0.50, ez + 0.026);
    box(headG, ew * 0.55, eh * 0.13, 0.045, lashC, bx + ew * 0.22, eyeY + eh * 0.46, ez + 0.026);
    /* 下眼线（细）*/
    box(headG, ew * 0.86, eh * 0.06, 0.040, shade(lashC, 1.5), bx, eyeY - eh * 0.52, ez + 0.020);
    /* 眉毛（两段折线，比 v3 细）*/
    box(headG, ew * 0.52, 0.032, 0.030, P.hairS, bx - ew * 0.22, eyeY + eh * 0.86, ez - 0.002);
    box(headG, ew * 0.42, 0.030, 0.030, P.hairS, bx + ew * 0.26, eyeY + eh * 0.90, ez - 0.002, -0.10 * s);
  }
  /* 鼻子（极小一块，靠阴影） */
  box(headG, 0.05, 0.05, 0.03, P.skinS, 0, eyeY - eh * 0.55, ez + 0.004);
  /* 嘴：一条线 + 两侧小弧，像微笑 */
  box(headG, 0.09, 0.035, 0.028, 0xcf6b74, 0, -hh * 0.30, ez);
  box(headG, 0.035, 0.030, 0.028, 0xcf6b74, -0.062, -hh * 0.285, ez);
  box(headG, 0.035, 0.030, 0.028, 0xcf6b74, 0.062, -hh * 0.285, ez);
  /* 腮红 */
  if (E.blush) {
    box(headG, 0.17, 0.06, 0.02, 0xf2a8ac, -hw * 0.33, -hh * 0.15, ez - 0.006);
    box(headG, 0.17, 0.06, 0.02, 0xf2a8ac, hw * 0.33, -hh * 0.15, ez - 0.006);
  }
}

/* ---------------- 头发（v4：分层） ---------------- */
function buildHair(headG, S, P, style, pinColor) {
  var hc = P.hair, hi = P.hair2, hs = P.hairS;
  var hw = S.headW, hh = S.headH, hd = S.headD;

  function cap() {
    /* 头顶 + 后脑 + 两侧（三层，做出体积感）*/
    box(headG, hw * 1.06, 0.24, hd * 1.06, hc, 0, hh * 0.52, 0);
    box(headG, hw * 0.92, 0.10, hd * 0.92, hi, 0, hh * 0.60, 0);              /* 顶部高光 */
    box(headG, hw * 1.06, hh * 0.64, hd * 0.34, hc, 0, hh * 0.16, -hd * 0.48); /* 后脑 */
    box(headG, hw * 1.06, hh * 0.40, hd * 0.30, hs, 0, hh * 0.02, -hd * 0.50); /* 后脑阴影 */
    box(headG, hw * 0.11, hh * 0.72, hd * 1.02, hc, -hw * 0.505, hh * 0.18, 0);
    box(headG, hw * 0.11, hh * 0.72, hd * 1.02, hc, hw * 0.505, hh * 0.18, 0);
  }
  function bangs() {
    /* 主刘海 + 中间分缝 + 眼侧两撮 + 下面一层更深的短碎发（锯齿感）*/
    box(headG, hw * 0.98, 0.30, 0.08, hc, 0, hh * 0.32, hd * 0.50);
    box(headG, hw * 0.20, 0.14, 0.08, hi, 0, hh * 0.44, hd * 0.50);
    box(headG, hw * 0.19, 0.34, 0.08, hc, -hw * 0.39, hh * 0.27, hd * 0.50);
    box(headG, hw * 0.19, 0.34, 0.08, hc, hw * 0.39, hh * 0.27, hd * 0.50);
    box(headG, hw * 0.13, 0.12, 0.078, hs, -hw * 0.20, hh * 0.17, hd * 0.505);
    box(headG, hw * 0.11, 0.10, 0.078, hs, hw * 0.13, hh * 0.18, hd * 0.505);
  }
  function sidelocks(len) {
    box(headG, 0.085, len, hd * 0.40, hc, -hw * 0.50, -len / 2 + hh * 0.20, hd * 0.24);
    box(headG, 0.085, len, hd * 0.40, hc, hw * 0.50, -len / 2 + hh * 0.20, hd * 0.24);
    /* 发梢（深一点）*/
    box(headG, 0.085, 0.10, hd * 0.40, hs, -hw * 0.50, -len + hh * 0.20, hd * 0.24);
    box(headG, 0.085, 0.10, hd * 0.40, hs, hw * 0.50, -len + hh * 0.20, hd * 0.24);
  }
  function back(len, c) {
    box(headG, hw * 1.00, len, hd * 0.40, c || hc, 0, -len / 2 + hh * 0.30, -hd * 0.44);
    box(headG, hw * 0.96, len * 0.16, hd * 0.42, hs, 0, -len + hh * 0.30 + len * 0.06, -hd * 0.44);
  }

  if (style === 'short') { cap(); bangs(); sidelocks(0.30); }
  else if (style === 'bob') { cap(); bangs(); sidelocks(0.54); back(0.58); }
  else if (style === 'long') { cap(); bangs(); sidelocks(0.78); back(1.55); }
  else if (style === 'hime') {
    cap(); bangs(); sidelocks(0.64); back(1.45);
    box(headG, hw * 1.02, 0.16, hd * 0.94, hc, 0, hh * 0.30, -hd * 0.16);   /* 姬发式的"齐" */
    box(headG, hw * 1.02, 0.05, hd * 0.94, hs, 0, hh * 0.22, -hd * 0.16);
  } else if (style === 'twintail') {
    cap(); bangs(); sidelocks(0.36);
    var tl = 0.92;
    for (var s = -1; s <= 1; s += 2) {
      box(headG, 0.20, 0.18, 0.20, hc, hw * 0.56 * s, hh * 0.42, -hd * 0.04);
      /* 扎带 */
      box(headG, 0.23, 0.07, 0.23, pinColor || hi, hw * 0.58 * s, hh * 0.36, -hd * 0.04);
      box(headG, 0.18, tl * 0.62, 0.18, hc, hw * 0.62 * s, hh * 0.32 - tl * 0.30, -hd * 0.08);
      box(headG, 0.16, tl * 0.44, 0.16, hc, hw * 0.63 * s, hh * 0.32 - tl * 0.74, -hd * 0.10);
      box(headG, 0.15, 0.10, 0.15, hs, hw * 0.63 * s, hh * 0.32 - tl * 0.95, -hd * 0.10);
    }
  } else if (style === 'ponytail') {
    cap(); bangs(); sidelocks(0.42);
    box(headG, 0.22, 0.18, 0.22, hc, 0, hh * 0.48, -hd * 0.54);
    box(headG, 0.26, 0.07, 0.26, pinColor || hi, 0, hh * 0.42, -hd * 0.54);
    box(headG, 0.20, 0.70, 0.20, hc, 0, hh * 0.36 - 0.36, -hd * 0.62);
    box(headG, 0.17, 0.52, 0.17, hc, 0, hh * 0.36 - 0.92, -hd * 0.66);
    box(headG, 0.15, 0.10, 0.15, hs, 0, hh * 0.36 - 1.20, -hd * 0.66);
  } else if (style === 'veil') {
    box(headG, hw * 1.14, 0.30, hd * 1.14, 0xffffff, 0, hh * 0.52, 0);
    box(headG, hw * 1.14, hh * 0.92, 0.14, 0xffffff, 0, -hh * 0.10, -hd * 0.56);
    box(headG, 0.13, hh * 0.92, hd * 0.94, 0xffffff, -hw * 0.58, -hh * 0.10, 0);
    box(headG, 0.13, hh * 0.92, hd * 0.94, 0xffffff, hw * 0.58, -hh * 0.10, 0);
    box(headG, hw * 1.10, 0.05, 0.15, 0xd8dce6, 0, hh * 0.36, -hd * 0.56);
  }

  /* 发饰：蝴蝶结 / 小夹子（放在头顶一侧）*/
  if (pinColor) {
    var px = hw * 0.36, py = hh * 0.46, pz = hd * 0.30;
    box(headG, 0.20, 0.10, 0.10, pinColor, px, py, pz);
    box(headG, 0.10, 0.14, 0.10, pinColor, px - 0.13, py + 0.02, pz);
    box(headG, 0.10, 0.14, 0.10, pinColor, px + 0.13, py + 0.02, pz);
    box(headG, 0.06, 0.06, 0.11, shade(pinColor, 0.8), px, py, pz + 0.02);
  }
  /* 呆毛（放到最后，绝不插在 if 链里） */
  if (style === 'twintail' || style === 'bob' || style === 'hime' || style === 'veil' || style === 'short') {
    box(headG, 0.07, 0.18, 0.07, hc, hw * 0.06, hh * 0.60, hd * 0.10, 0.42);
    box(headG, 0.05, 0.10, 0.05, hc, hw * 0.13, hh * 0.70, hd * 0.10, 0.75);
  }
}

/* ---------------- 搭角色 ---------------- */
function buildChar(ch) {
  var g = new THREE.Group();
  var S = {}; for (var k in DEF) { S[k] = DEF[k]; }
  for (var k2 in (ch.sk || {})) { S[k2] = ch.sk[k2]; }
  var P = ch.c;

  /* ★ 肩宽自动跟随躯干宽 ✗ 不然手臂会飘在身体外面（v4 第一版就是这样）✓ */
  S.armX = S.torsoW * 0.5 + S.armW * 0.55;
  var hipY = S.hipY;
  var torsoTop = hipY + S.torsoH;
  var shoulderY = torsoTop - 0.06;
  var headY = torsoTop + S.neck + S.headH / 2 + 0.05;

  function limb(x, y, w, h, d, c) {
    var p = new THREE.Group();
    p.position.set(x, y, 0);
    box(p, w, h, d, c, 0, -h / 2, 0);
    g.add(p);
    return p;
  }

  /* ---- 腿：大腿 + 小腿（两段，看得出膝盖）+ 袜口 + 鞋底 ---- */
  var legL = new THREE.Group(), legR = new THREE.Group();
  legL.position.set(-S.legW * 0.72, hipY, 0);
  legR.position.set(S.legW * 0.72, hipY, 0);
  g.add(legL); g.add(legR);
  [legL, legR].forEach(function (lg) {
    box(lg, S.legW, hipY * 0.52, S.legW, P.pants, 0, -hipY * 0.26, 0);            /* 大腿 */
    box(lg, S.legW * 0.92, hipY * 0.46, S.legW * 0.92, P.sock || P.pants, 0, -hipY * 0.73, 0); /* 小腿 */
    if (P.sock) {                                                                   /* 袜口 */
      box(lg, S.legW * 1.02, 0.07, S.legW * 1.02, shade(P.sock, 1.1), 0, -hipY * 0.50, 0);
    }
    box(lg, S.legW * 1.10, 0.16, S.legW * 1.34, P.boot, 0, -hipY + 0.09, 0.03);     /* 鞋 */
    box(lg, S.legW * 1.16, 0.05, S.legW * 1.40, shade(P.boot, 0.7), 0, -hipY + 0.01, 0.03); /* 鞋底 */
  });

  /* ---- 躯干：胸 / 腰 / 胯 三段 ---- */
  box(g, S.torsoW, S.torsoH * 0.56, S.torsoD, P.shirt, 0, torsoTop - S.torsoH * 0.28, 0);
  box(g, S.torsoW * 0.84, S.torsoH * 0.30, S.torsoD * 0.92, P.shirt, 0, hipY + S.torsoH * 0.35, 0);
  box(g, S.torsoW * 0.95, S.torsoH * 0.22, S.torsoD * 0.98, P.shirt, 0, hipY + S.torsoH * 0.12, 0);
  /* 侧面阴影（让身体不那么平）*/
  box(g, 0.04, S.torsoH * 0.54, S.torsoD * 0.9, P.shirtS, -S.torsoW * 0.49, torsoTop - S.torsoH * 0.28, 0);
  box(g, 0.04, S.torsoH * 0.54, S.torsoD * 0.9, P.shirtS, S.torsoW * 0.49, torsoTop - S.torsoH * 0.28, 0);
  /* 腰带 */
  box(g, S.torsoW * 0.92, 0.12, S.torsoD * 0.96, P.belt, 0, hipY + 0.14, 0);
  box(g, 0.12, 0.12, 0.06, P.gold, 0, hipY + 0.14, S.torsoD * 0.50);
  /* 胸口（轻微）*/
  box(g, S.torsoW * 0.70, 0.14, S.torsoD * 1.00, P.shirt, 0, torsoTop - S.torsoH * 0.36, S.torsoD * 0.04);

  /* ---- 手臂：袖子 + 袖口 + 手 ---- */
  var armL = limb(-S.armX, shoulderY, S.armW, S.armLen, S.armW, P.shirtD);
  var armR = limb(S.armX, shoulderY, S.armW, S.armLen, S.armW, P.shirt);
  [armL, armR].forEach(function (ar, i) {
    var sleeve = i === 0 ? P.shirtD : P.shirt;
    box(ar, S.armW * 1.04, S.armLen * 0.52, S.armW * 1.04, sleeve, 0, -S.armLen * 0.26, 0);  /* 袖 */
    box(ar, S.armW * 1.06, 0.06, S.armW * 1.06, shade(sleeve, 1.2), 0, -S.armLen * 0.52, 0);  /* 袖口 */
    box(ar, S.armW * 0.86, S.armLen * 0.40, S.armW * 0.86, P.skin, 0, -S.armLen * 0.74, 0);    /* 小臂 */
    box(ar, S.armW * 0.94, 0.12, S.armW * 0.94, P.skin, 0, -S.armLen + 0.05, 0);               /* 手 */
  });

  /* ---- 头 ---- */
  var headG = new THREE.Group(); headG.position.set(0, headY, 0); g.add(headG);
  box(headG, S.headW, S.headH, S.headD, P.skin, 0, 0, 0);
  /* 下巴/脸颊阴影（一小条，增加立体）*/
  box(headG, S.headW * 0.86, 0.06, S.headD * 0.9, P.skinS, 0, -S.headH * 0.48, S.headD * 0.04);
  box(g, S.armW * 0.86, 0.10, S.armW * 0.86, P.skinS, 0, torsoTop + 0.03, 0);   /* 脖子 */

  buildFace(headG, S, P, ch.eyes || { w: 0.26, h: 0.30 });
  buildHair(headG, S, P, ch.hair, ch.hairpin);

  var backG = new THREE.Group();
  backG.position.set(0, torsoTop - 0.30, -S.torsoD * 0.5);
  g.add(backG);

  buildOutfit(g, S, P, ch, hipY, torsoTop);
  buildAcc(g, headG, armL, armR, legL, legR, S, P, ch.acc, backG, hipY, torsoTop);

  armL.rotation.x = 0.12; armR.rotation.x = -0.14;
  legL.rotation.x = 0.03; legR.rotation.x = -0.03;
  g.userData.h = headY + S.headH / 2;
  return g;
}

/* ---------------- 场景 ---------------- */
var cv = document.getElementById('cv');
var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1500, 1400, false);
renderer.setClearColor(0x0a0c11, 1);

var scene = new THREE.Scene();
var COLS = 5, ROWS = 4, SX = 3.5, SY = 3.9;
var cam = new THREE.OrthographicCamera(-9, 9, 9, -9, 0.1, 300);
cam.position.set(0, 0, 80); cam.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3242, 0.58));
var d1 = new THREE.DirectionalLight(0xffffff, 0.52); d1.position.set(5, 9, 12); scene.add(d1);
var d2 = new THREE.DirectionalLight(0x9ac0ff, 0.24); d2.position.set(-9, 5, -8); scene.add(d2);
var d3 = new THREE.DirectionalLight(0xffe0c0, 0.14); d3.position.set(0, 2, 12); scene.add(d3);
var d4 = new THREE.DirectionalLight(0xffffff, 0.16); d4.position.set(-3, 8, -12); scene.add(d4);  // 轮廓光

var heroes = [];
var PREVIEW_S = 0.80;
for (var i = 0; i < CHARS.length; i++) {
  var c2 = i % COLS, r2 = Math.floor(i / COLS);
  var h = buildChar(CHARS[i]);
  h.scale.multiplyScalar(PREVIEW_S);
  var groundY = ((ROWS - 1) / 2 - r2) * SY - SY / 2 + 0.45;
  h.position.set((c2 - (COLS - 1) / 2) * SX, groundY, 0);
  h.rotation.y = -0.36;
  scene.add(h);
  heroes.push(h);
}

var bbox = new THREE.Box3();
for (var bi = 0; bi < heroes.length; bi++) { bbox.expandByObject(heroes[bi]); }
bbox.min.y -= 0.9;
var bsize = bbox.getSize(new THREE.Vector3());
var bcen = bbox.getCenter(new THREE.Vector3());
var ASPECT = 1500 / 1400;
var vh = Math.max(bsize.y, bsize.x / ASPECT) * 1.06;
cam.left = -vh * ASPECT / 2; cam.right = vh * ASPECT / 2;
cam.top = vh / 2; cam.bottom = -vh / 2;
cam.position.set(bcen.x, bcen.y, 80);
cam.lookAt(bcen.x, bcen.y, 0);
cam.updateProjectionMatrix();

var labelBox = document.getElementById('labels');
var _pv = null;
function placeLabels() {
  for (var k = 0; k < heroes.length; k++) {
    var hh = heroes[k];
    var wp = new THREE.Vector3(hh.position.x, hh.position.y - 0.16, 0);
    if (!_pv) { _pv = new THREE.Vector3(); }
    _pv.copy(wp).project(cam);
    var sx = (_pv.x * 0.5 + 0.5) * 1500;
    var sy = (-_pv.y * 0.5 + 0.5) * 1400;
    var el = hh.userData.lb;
    if (!el) {
      el = document.createElement('div');
      el.className = 'lb';
      el.innerHTML = '<b>' + CHARS[k].n + '</b><i>' + CHARS[k].sx + '</i>';
      labelBox.appendChild(el);
      hh.userData.lb = el;
    }
    el.style.left = sx.toFixed(1) + 'px';
    el.style.top = sy.toFixed(1) + 'px';
  }
}
placeLabels();

var t0 = performance.now();
function loop() {
  var t = (performance.now() - t0) / 1000;
  for (var i2 = 0; i2 < heroes.length; i2++) {
    heroes[i2].rotation.y = -0.28 + Math.sin(t * 0.45 + i2 * 0.6) * 0.22;
  }
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();
window.__ready = true;
</script>
