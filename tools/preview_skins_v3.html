/* ---------------- 基础工具 ---------------- */
var matCache = {};
function matOf(c) {
  if (matCache[c]) { return matCache[c]; }
  matCache[c] = new THREE.MeshLambertMaterial({ color: c });
  return matCache[c];
}
function box(parent, w, h, d, c, x, y, z) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matOf(c));
  m.position.set(x || 0, y || 0, z || 0);
  parent.add(m);
  return m;
}
function taper(parent, wTop, wBot, h, c, x, y, z) {
  var m = new THREE.Mesh(new THREE.CylinderGeometry(wTop * 0.7071, wBot * 0.7071, h, 4, 1), matOf(c));
  m.rotation.y = Math.PI / 4;
  m.position.set(x || 0, y || 0, z || 0);
  parent.add(m);
  return m;
}

/* ---------------- 二次元的"脸" ---------------- */
function buildFace(headG, S, P, E, acc) {
  var ew = E.w, eh = E.h;
  var ez = S.headD * 0.5 + 0.015;
  /* 眼白 */
  box(headG, ew, eh, 0.03, 0xffffff, -S.headW * 0.215, S.headH * 0.02, ez);
  box(headG, ew, eh, 0.03, 0xffffff, S.headW * 0.215, S.headH * 0.02, ez);
  /* 虹膜 */
  box(headG, ew * 0.72, eh * 0.72, 0.035, P.iris, -S.headW * 0.215, S.headH * 0.005, ez + 0.016);
  box(headG, ew * 0.72, eh * 0.72, 0.035, P.iris, S.headW * 0.215, S.headH * 0.005, ez + 0.016);
  /* 瞳孔 */
  box(headG, ew * 0.34, eh * 0.36, 0.04, 0x14141a, -S.headW * 0.215, S.headH * 0.0, ez + 0.03);
  box(headG, ew * 0.34, eh * 0.36, 0.04, 0x14141a, S.headW * 0.215, S.headH * 0.0, ez + 0.03);
  /* 高光（左上一点白） */
  box(headG, ew * 0.20, eh * 0.18, 0.042, 0xffffff, -S.headW * 0.215 - ew * 0.16, S.headH * 0.02 + eh * 0.18, ez + 0.045);
  box(headG, ew * 0.20, eh * 0.18, 0.042, 0xffffff, S.headW * 0.215 - ew * 0.16, S.headH * 0.02 + eh * 0.18, ez + 0.045);
  /* 睫毛（上缘一条深色）*/
  box(headG, ew * 1.06, eh * 0.14, 0.045, 0x22222a, -S.headW * 0.215, S.headH * 0.02 + eh * 0.5, ez + 0.02);
  box(headG, ew * 1.06, eh * 0.14, 0.045, 0x22222a, S.headW * 0.215, S.headH * 0.02 + eh * 0.5, ez + 0.02);
  /* 眉毛（细） */
  box(headG, ew * 0.92, 0.035, 0.03, P.hair, -S.headW * 0.215, S.headH * 0.02 + eh * 0.86, ez);
  box(headG, ew * 0.92, 0.035, 0.03, P.hair, S.headW * 0.215, S.headH * 0.02 + eh * 0.86, ez);
  /* 小嘴 */
  box(headG, 0.10, 0.045, 0.03, 0xd0707a, 0, -S.headH * 0.30, ez);
  /* 腮红（可选）*/
  if (E.blush) {
    box(headG, 0.16, 0.07, 0.02, 0xf0a0a0, -S.headW * 0.34, -S.headH * 0.16, ez - 0.005);
    box(headG, 0.16, 0.07, 0.02, 0xf0a0a0, S.headW * 0.34, -S.headH * 0.16, ez - 0.005);
  }
}

/* ---------------- 二次元的"头发" ---------------- */
function buildHair(headG, S, P, style) {
  var hc = P.hair, hc2 = P.hair2 || P.hair;
  var hw = S.headW, hh = S.headH, hd = S.headD;
  /* 所有发型都有：头顶 + 齐刘海 + 两侧鬓发 */
  function cap() {
    box(headG, hw * 1.06, 0.24, hd * 1.06, hc, 0, hh * 0.52, 0);          /* 头顶 */
    box(headG, hw * 1.06, hh * 0.62, hd * 0.30, hc, 0, hh * 0.16, -hd * 0.50); /* 后脑 */
    box(headG, hw * 0.12, hh * 0.70, hd * 1.02, hc, -hw * 0.50, hh * 0.20, 0);  /* 两侧（包住耳朵）*/
    box(headG, hw * 0.12, hh * 0.70, hd * 1.02, hc, hw * 0.50, hh * 0.20, 0);
  }
  function bangs() {
    /* 齐刘海：一整条盖住额头 */
    box(headG, hw * 0.98, 0.32, 0.08, hc, 0, hh * 0.31, hd * 0.50);
    /* 中间一小撮（往上提一点，像分缝）*/
    box(headG, hw * 0.22, 0.16, 0.08, hc, 0, hh * 0.42, hd * 0.50);
    /* 眼睛外侧的短碎发 */
    box(headG, hw * 0.20, 0.34, 0.08, hc, -hw * 0.38, hh * 0.26, hd * 0.50);
    box(headG, hw * 0.20, 0.34, 0.08, hc, hw * 0.38, hh * 0.26, hd * 0.50);
  }
  function sidelocks(len) {
    box(headG, 0.09, len, hd * 0.42, hc, -hw * 0.50, -len / 2 + hh * 0.20, hd * 0.22);
    box(headG, 0.09, len, hd * 0.42, hc, hw * 0.50, -len / 2 + hh * 0.20, hd * 0.22);
  }
  function back(len, c) {
    box(headG, hw * 1.00, len, hd * 0.42, c || hc, 0, -len / 2 + hh * 0.30, -hd * 0.42);
  }
  if (style === 'short') { cap(); bangs(); sidelocks(0.30); }
  else if (style === 'bob') { cap(); bangs(); sidelocks(0.52); back(0.56); }
  else if (style === 'long') { cap(); bangs(); sidelocks(0.74); back(1.5); }
  else if (style === 'hime') {       /* 姬发式：齐刘海 + 两侧齐耳 + 后面长 */
    cap(); bangs(); sidelocks(0.62); back(1.4);
    box(headG, hw * 1.02, 0.18, hd * 0.9, hc, 0, hh * 0.30, -hd * 0.18);
  } else if (style === 'twintail') {
    cap(); bangs(); sidelocks(0.34);
    /* 双马尾：扎在两侧靠上，垂到腰 */
    var tl = 0.95;
    box(headG, 0.22, 0.20, 0.22, hc, -hw * 0.58, hh * 0.40, -hd * 0.06);
    box(headG, 0.22, 0.20, 0.22, hc, hw * 0.58, hh * 0.40, -hd * 0.06);
    box(headG, 0.20, tl, 0.20, hc, -hw * 0.62, hh * 0.40 - tl / 2 - 0.04, -hd * 0.10);
    box(headG, 0.20, tl, 0.20, hc, hw * 0.62, hh * 0.40 - tl / 2 - 0.04, -hd * 0.10);
    box(headG, 0.10, 0.10, 0.10, hc2, -hw * 0.58, hh * 0.40, -hd * 0.06);
    box(headG, 0.10, 0.10, 0.10, hc2, hw * 0.58, hh * 0.40, -hd * 0.06);
  } else if (style === 'ponytail') {
    cap(); bangs(); sidelocks(0.40);
    box(headG, 0.26, 0.24, 0.26, hc, 0, hh * 0.50, -hd * 0.56);
    box(headG, 0.24, 1.10, 0.24, hc, 0, hh * 0.44 - 0.55, -hd * 0.64);
  } else if (style === 'veil') {     /* 修女头巾 */
    box(headG, hw * 1.14, 0.30, hd * 1.14, 0xffffff, 0, hh * 0.52, 0);
    box(headG, hw * 1.14, hh * 0.9, 0.16, 0xffffff, 0, -hh * 0.10, -hd * 0.54);
    box(headG, 0.14, hh * 0.9, hd * 0.9, 0xffffff, -hw * 0.58, -hh * 0.10, 0);
    box(headG, 0.14, hh * 0.9, hd * 0.9, 0xffffff, hw * 0.58, -hh * 0.10, 0);
  }
  /* ★ 呆毛：放在整条 if/else 链【之后】✗ 插在中间会把后面的分支吃掉 ✓ */
  if (style === 'twintail' || style === 'bob' || style === 'hime' || style === 'veil') {
    var ah2 = box(headG, 0.07, 0.20, 0.07, hc, hw * 0.08, hh * 0.58, hd * 0.12);
    ah2.rotation.z = 0.45;
  }
}

/* ---------------- 服装轮廓 ---------------- */
function buildOutfit(g, S, P, ch, hipY, torsoTop) {
  var kind = ch.outfit || 'plain';
  var skirt = ch.skirt;
  /* 领子 */
  if (kind === 'sailor' || kind === 'kendo' || kind === 'sport') {
    box(g, S.torsoW * 0.92, 0.18, S.torsoD * 1.04, P.collar, 0, torsoTop - 0.04, 0);
    if (kind === 'sailor') {                   /* 水手领（背后一片 + 前面 V） */
      box(g, S.torsoW * 0.86, 0.30, S.torsoD * 0.30, P.collar, 0, torsoTop - 0.20, -S.torsoD * 0.42);
      box(g, 0.16, 0.34, 0.06, P.collar, 0, torsoTop - 0.26, S.torsoD * 0.52);
      box(g, 0.20, 0.16, 0.10, P.gold, 0, torsoTop - 0.36, S.torsoD * 0.54);
    }
  } else if (kind === 'maid') {
    box(g, S.torsoW * 0.92, 0.16, S.torsoD * 1.04, P.apron, 0, torsoTop - 0.04, 0);
    box(g, S.torsoW * 0.52, S.torsoH * 0.52, 0.06, P.apron, 0, hipY + S.torsoH * 0.42, S.torsoD * 0.54);
    box(g, S.torsoW * 0.60, 0.12, S.torsoD * 0.62, P.apron, 0, hipY + 0.22, 0);
  } else if (kind === 'miko') {
    box(g, S.torsoW * 0.90, 0.18, S.torsoD * 1.04, P.collar, 0, torsoTop - 0.06, 0);
    box(g, 0.90, 0.10, 0.10, P.gold, 0, torsoTop - 0.24, S.torsoD * 0.50);
  } else if (kind === 'nun') {
    box(g, 0.14, 0.20, 0.06, P.gold, 0, torsoTop - 0.30, S.torsoD * 0.54);
    box(g, 0.44, 0.44, 0.06, P.gold, 0, torsoTop - 0.34, S.torsoD * 0.54);
  } else if (kind === 'mech') {
    box(g, S.torsoW * 1.04, 0.24, S.torsoD * 1.06, P.shirtD, 0, torsoTop - 0.10, 0);
    box(g, 0.18, 0.18, 0.08, P.collar, -S.torsoW * 0.28, torsoTop - 0.34, S.torsoD * 0.52);
    box(g, 0.10, 0.60, 0.10, P.gold, S.torsoW * 0.48, hipY + 0.30, -S.torsoD * 0.40);
  } else if (kind === 'armorkirt') {
    box(g, S.torsoW * 1.08, 0.34, S.torsoD * 1.06, P.shirtD, 0, torsoTop - 0.16, 0);
    box(g, 0.50, 0.18, 0.50, P.shirtD, -S.armX, torsoTop - 0.10, 0);
    box(g, 0.50, 0.18, 0.50, P.shirtD, S.armX, torsoTop - 0.10, 0);
  } else if (kind === 'sport' || kind === 'hoodie') {
    box(g, S.torsoW * 0.94, 0.20, S.torsoD * 1.06, P.collar, 0, torsoTop - 0.05, 0);
  }
  /* 裙子 / 长袍 */
  if (skirt) {
    taper(g, skirt.top, skirt.bot, skirt.len, P.skirt || P.shirt, 0, hipY - skirt.len / 2 + 0.26, 0);
    if (kind === 'maid' || kind === 'frill') {
      /* 荷叶边：短裙下缘一圈 */
      taper(g, skirt.bot * 1.02, skirt.bot * 1.14, 0.12, P.apron || 0xffffff, 0,
             hipY - skirt.len + 0.32, 0);
    }
    if (kind === 'kendo' || kind === 'miko') {
      /* 袴/裙的褶：两条竖线 */
      box(g, 0.05, skirt.len * 0.85, 0.06, 0x000022, -skirt.bot * 0.28, hipY - skirt.len / 2 + 0.28, S.torsoD * 0.42);
      box(g, 0.05, skirt.len * 0.85, 0.06, 0x000022, skirt.bot * 0.28, hipY - skirt.len / 2 + 0.28, S.torsoD * 0.42);
    }
  }
}

/* ---------------- 配件 ---------------- */
function buildAcc(g, headG, armL, armR, legL, legR, S, P, kind, backG) {
  if (!kind) { return; }
  var hw = S.headW, hh = S.headH;
  if (kind === 'catEar') {
    box(headG, 0.26, 0.30, 0.20, P.hair, -hw * 0.36, hh * 0.72, 0.02);
    box(headG, 0.26, 0.30, 0.20, P.hair, hw * 0.36, hh * 0.72, 0.02);
    box(headG, 0.14, 0.16, 0.10, 0xf0a0b0, -hw * 0.36, hh * 0.68, 0.10);
    box(headG, 0.14, 0.16, 0.10, 0xf0a0b0, hw * 0.36, hh * 0.68, 0.10);
  } else if (kind === 'foxEar') {
    box(headG, 0.22, 0.40, 0.16, P.hair, -hw * 0.34, hh * 0.80, 0.0);
    box(headG, 0.22, 0.40, 0.16, P.hair, hw * 0.34, hh * 0.80, 0.0);
  } else if (kind === 'elfEar') {
    box(headG, 0.10, 0.30, 0.10, P.skin, -hw * 0.56, hh * 0.10, -0.02).rotation.z = 0.35;
    box(headG, 0.10, 0.30, 0.10, P.skin, hw * 0.56, hh * 0.10, -0.02).rotation.z = -0.35;
  } else if (kind === 'demonHorn') {
    box(headG, 0.14, 0.34, 0.14, 0xd03050, -hw * 0.34, hh * 0.78, 0.02).rotation.z = 0.25;
    box(headG, 0.14, 0.34, 0.14, 0xd03050, hw * 0.34, hh * 0.78, 0.02).rotation.z = -0.25;
    box(headG, 0.10, 0.26, 0.10, 0xb02040, -hw * 0.40, hh * 0.96, 0.02).rotation.z = 0.45;
    box(headG, 0.10, 0.26, 0.10, 0xb02040, hw * 0.40, hh * 0.96, 0.02).rotation.z = -0.45;
  } else if (kind === 'halo') {
    var ring = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.045, 8, 20), matOf(0xffe066));
    ring.position.set(0, hh * 0.92, -0.05);
    ring.rotation.x = Math.PI / 2;
    headG.add(ring);
  } else if (kind === 'visor') {
    box(headG, hw * 0.92, 0.14, 0.06, 0x0ae0e0, 0, hh * 0.06, hw * 0.52);
  } else if (kind === 'glasses') {
    box(headG, 0.20, 0.14, 0.04, 0x222a36, -hw * 0.215, hh * 0.02, S.headD * 0.54);
    box(headG, 0.20, 0.14, 0.04, 0x222a36, hw * 0.215, hh * 0.02, S.headD * 0.54);
  } else if (kind === 'headband') {
    box(headG, hw * 1.04, 0.10, S.headD * 1.04, 0xffffff, 0, hh * 0.42, 0);
  } else if (kind === 'ribbon') {
    box(headG, 0.50, 0.16, 0.10, 0xd8342c, 0, hh * 0.56, -S.headD * 0.30);
    box(headG, 0.16, 0.12, 0.10, 0xd8342c, -0.24, hh * 0.60, -S.headD * 0.30);
    box(headG, 0.16, 0.12, 0.10, 0xd8342c, 0.24, hh * 0.60, -S.headD * 0.30);
  } else if (kind === 'gloves') {
    box(armL, S.armW * 1.5, 0.26, S.armW * 1.5, 0xd8342c, 0, -S.armLen + 0.16, 0);
    box(armR, S.armW * 1.5, 0.26, S.armW * 1.5, 0xd8342c, 0, -S.armLen + 0.16, 0);
  } else if (kind === 'cape') {
    box(backG, S.torsoW * 1.16, S.torsoH * 1.1 + 0.5, 0.10, 0x8a2a3a, 0, -0.28, -0.06);
  } else if (kind === 'batWing') {
    box(backG, 0.80, 0.60, 0.08, 0x2a1a2a, -0.52, 0.10, -0.04).rotation.z = 0.22;
    box(backG, 0.80, 0.60, 0.08, 0x2a1a2a, 0.52, 0.10, -0.04).rotation.z = -0.22;
  } else if (kind === 'blood') {
    box(headG, 0.10, 0.34, 0.04, 0x8a1a1a, -hw * 0.30, -hh * 0.28, S.headD * 0.52);
    box(g, 0.14, 0.50, 0.04, 0x8a1a1a, S.torsoW * 0.20, 0, S.torsoD * 0.54);
  } else if (kind === 'snow') {
    var fl = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.10, 0.10), matOf(0xffffff));
    fl.position.set(0.42, hh * 0.40, 0.10); headG.add(fl);
  }
}

/* ---------------- 搭一个二次元角色 ---------------- */
function buildChar(ch) {
  var g = new THREE.Group();
  var S = {}; for (var k in DEF) { S[k] = DEF[k]; }
  for (var k2 in (ch.sk || {})) { S[k2] = ch.sk[k2]; }
  var P = ch.c;

  var hipY = S.hipY;
  var torsoTop = hipY + S.torsoH;
  var shoulderY = torsoTop - 0.06;
  var headY = torsoTop + S.neck + S.headH / 2 + 0.05;

  function limb(x, y, w, h, d, c) {
    var p = new THREE.Group();
    p.position.set(x, y, 0);
    box(p, w, h, d, c, 0, -h / 2, 0);
    g.add(p);
    return p;
  }
  /* 腿（脚底在 0） */
  var legL = limb(-S.legW * 0.72, hipY, S.legW, hipY, S.legW, P.pants);
  var legR = limb(S.legW * 0.72, hipY, S.legW, hipY, S.legW, P.pants);
  /* 过膝袜 / 靴 */
  if (P.sock) {
    box(legL, S.legW * 1.06, hipY * 0.52, S.legW * 1.06, P.sock, 0, -hipY * 0.74, 0);
    box(legR, S.legW * 1.06, hipY * 0.52, S.legW * 1.06, P.sock, 0, -hipY * 0.74, 0);
  }
  box(legL, S.legW * 1.12, 0.22, S.legW * 1.4, P.boot, 0, -hipY + 0.11, 0.04);
  box(legR, S.legW * 1.12, 0.22, S.legW * 1.4, P.boot, 0, -hipY + 0.11, 0.04);

  /* 躯干：胸 + 腰（细腰） */
  box(g, S.torsoW, S.torsoH * 0.58, S.torsoD, P.shirt, 0, torsoTop - S.torsoH * 0.29, 0);
  box(g, S.torsoW * 0.86, S.torsoH * 0.46, S.torsoD * 0.92, P.shirt, 0, hipY + S.torsoH * 0.22, 0);
  box(g, S.torsoW * 0.92, 0.14, S.torsoD * 0.98, P.belt, 0, hipY + 0.12, 0);
  /* 胸（轻微，避免扁平） */
  box(g, S.torsoW * 0.74, 0.16, S.torsoD * 1.02, P.shirt, 0, torsoTop - S.torsoH * 0.38, S.torsoD * 0.06);

  /* 手臂 */
  var armL = limb(-S.armX, shoulderY, S.armW, S.armLen, S.armW, P.shirtD);
  var armR = limb(S.armX, shoulderY, S.armW, S.armLen, S.armW, P.shirt);
  box(armL, S.armW * 1.06, 0.18, S.armW * 1.06, P.skin, 0, -S.armLen + 0.09, 0);
  box(armR, S.armW * 1.06, 0.18, S.armW * 1.06, P.skin, 0, -S.armLen + 0.09, 0);

  /* 头 + 五官 + 头发 */
  var headG = new THREE.Group(); headG.position.set(0, headY, 0); g.add(headG);
  box(headG, S.headW, S.headH, S.headD, P.skin, 0, 0, 0);
  /* 脖子 */
  box(g, S.armW * 0.9, 0.10, S.armW * 0.9, P.skin, 0, torsoTop + 0.03, 0);
  buildFace(headG, S, P, ch.eyes || { w: 0.26, h: 0.30 }, ch.acc);
  buildHair(headG, S, P, ch.hair);

  /* 背（披风/翅膀挂点） */
  var backG = new THREE.Group();
  backG.position.set(0, torsoTop - 0.30, -S.torsoD * 0.5);
  g.add(backG);

  buildOutfit(g, S, P, ch, hipY, torsoTop);
  buildAcc(g, headG, armL, armR, legL, legR, S, P, ch.acc, backG);

  armL.rotation.x = 0.12; armR.rotation.x = -0.14;
  legL.rotation.x = 0.03; legR.rotation.x = -0.03;
  g.userData.h = headY + S.headH / 2;
  return g;
}

/* ---------------- 场景 ---------------- */
var cv = document.getElementById('cv');
var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1500, 1400, false);
renderer.setClearColor(0x0b0d12, 1);

var scene = new THREE.Scene();
var COLS = 5, ROWS = 4, SX = 3.5, SY = 3.9;
var cam = new THREE.OrthographicCamera(-9, 9, 9, -9, 0.1, 300);
cam.position.set(0, 0, 80); cam.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3242, 0.62));
var d1 = new THREE.DirectionalLight(0xffffff, 0.52); d1.position.set(5, 9, 12); scene.add(d1);
var d2 = new THREE.DirectionalLight(0x9ac0ff, 0.22); d2.position.set(-9, 5, -8); scene.add(d2);
var d3 = new THREE.DirectionalLight(0xffe0c0, 0.12); d3.position.set(0, 2, 12); scene.add(d3);

var heroes = [];
var PREVIEW_S = 0.80;
for (var i = 0; i < CHARS.length; i++) {
  var c2 = i % COLS, r2 = Math.floor(i / COLS);
  var h = buildChar(CHARS[i]);
  h.scale.multiplyScalar(PREVIEW_S);
  var groundY = ((ROWS - 1) / 2 - r2) * SY - SY / 2 + 0.45;
  h.position.set((c2 - (COLS - 1) / 2) * SX, groundY, 0);
  h.rotation.y = -0.36;
  scene.add(h);
  heroes.push(h);
}

var bbox = new THREE.Box3();
for (var bi = 0; bi < heroes.length; bi++) { bbox.expandByObject(heroes[bi]); }
bbox.min.y -= 0.9;
var bsize = bbox.getSize(new THREE.Vector3());
var bcen = bbox.getCenter(new THREE.Vector3());
var ASPECT = 1500 / 1400;
var vh = Math.max(bsize.y, bsize.x / ASPECT) * 1.06;
cam.left = -vh * ASPECT / 2; cam.right = vh * ASPECT / 2;
cam.top = vh / 2; cam.bottom = -vh / 2;
cam.position.set(bcen.x, bcen.y, 80);
cam.lookAt(bcen.x, bcen.y, 0);
cam.updateProjectionMatrix();

var labelBox = document.getElementById('labels');
var _pv = null;
function placeLabels() {
  for (var k = 0; k < heroes.length; k++) {
    var hh = heroes[k];
    var wp = new THREE.Vector3(hh.position.x, hh.position.y - 0.16, 0);
    if (!_pv) { _pv = new THREE.Vector3(); }
    _pv.copy(wp).project(cam);
    var sx = (_pv.x * 0.5 + 0.5) * 1500;
    var sy = (-_pv.y * 0.5 + 0.5) * 1400;
    var el = hh.userData.lb;
    if (!el) {
      el = document.createElement('div');
      el.className = 'lb';
      el.innerHTML = '<b>' + CHARS[k].n + '</b><i>' + CHARS[k].sx + '</i>';
      labelBox.appendChild(el);
      hh.userData.lb = el;
    }
    el.style.left = sx.toFixed(1) + 'px';
    el.style.top = sy.toFixed(1) + 'px';
  }
}
placeLabels();

var t0 = performance.now();
function loop() {
  var t = (performance.now() - t0) / 1000;
  for (var i2 = 0; i2 < heroes.length; i2++) {
    heroes[i2].rotation.y = -0.30 + Math.sin(t * 0.5 + i2 * 0.6) * 0.20;
  }
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();
window.__ready = true;
</script>
