<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>攻击键样式候选 3 · 纯图标 + 游戏同色系</title>
<style>
  html,body{margin:0}
  /* 背景直接取游戏里的废土色调，方便判断"搭不搭" */
  body{background:linear-gradient(180deg,#8a7a66 0%,#6f6250 55%,#4e4536 100%);
    font-family:system-ui,"Microsoft YaHei",sans-serif;padding:26px 18px}
  h2{color:#f3ead8;font-size:15px;font-weight:700;margin:0 0 4px;text-align:center;
    letter-spacing:1px;text-shadow:0 1px 4px #00000088}
  .sub{color:#e0d6c2;font-size:11.5px;text-align:center;margin-bottom:22px;text-shadow:0 1px 3px #00000077}
  .wrap{display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .cell{text-align:center;width:150px}
  .btn{width:108px;height:108px;margin:0 auto;display:flex;align-items:center;justify-content:center;
    user-select:none;position:relative;box-sizing:border-box}
  .btn svg{width:52px;height:52px;display:block;
    filter:drop-shadow(0 2px 3px #000000aa)}
  .cap{color:#f4ecdc;font-size:12.5px;margin-top:12px;text-shadow:0 1px 4px #00000088;line-height:1.6}
  .cap b{color:#ffd83d}
  .cap i{display:block;font-style:normal;color:#d8ccb4;font-size:10.5px}

  /* ① 锈铁圆扣 —— 干土褐 + 锈铁，跟地上的朽木/废墟一个色系 ---------------- */
  .b1{border-radius:50%;
    background:radial-gradient(circle at 36% 30%,#7d6859 0%,#5b483f 38%,#3a2c25 76%,#241b16 100%);
    border:2px solid #8e7a68;color:#d2c2ad;
    box-shadow:0 4px 12px #00000088,inset 0 1px 0 #ffffff26,inset 0 -9px 18px #00000055}

  /* ② 青铜令牌 —— 和设置面板那圈金边是同一个色系 -------------------------- */
  .b2{border-radius:12px;
    background:linear-gradient(180deg,#7a6740 0%,#54472a 45%,#2e2614 100%);
    border:2px solid #b39a5e;color:#eadfba;
    box-shadow:0 4px 12px #00000088,inset 0 0 0 3px #6a5a34,inset 0 -9px 18px #00000066}

  /* ③ 灰绿玉璧 —— 枯草/死水的绿，压得很灰，不抢眼 ------------------------ */
  .b3{border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#7d9482 0%,#4c6a5a 40%,#2a3d33 76%,#17221d 100%);
    border:2px solid #c0a276;color:#e8efe6;
    box-shadow:0 0 0 2px #4a3a1c,0 4px 12px #00000088,
      inset 0 2px 8px #ffffff2e,inset 0 -9px 18px #00000055}

  /* ④ 灰钢爪痕 —— 灰石/钢材，加一点锈圈 ---------------------------------- */
  .b4{border-radius:50%;
    background:radial-gradient(circle at 36% 28%,#737a80 0%,#4a5056 42%,#282d32 78%,#15191c 100%);
    border:2px solid #7f7566;color:#c9a86a;
    box-shadow:0 0 0 4px #7a5a4226,0 4px 12px #00000088,
      inset 0 1px 0 #ffffff26,inset 0 -9px 18px #00000066}

  /* ⑤ 暗血玉璧 —— 干了的血褐，不是鲜红 ------------------------------------ */
  .b5{border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#7a382a 0%,#4e2118 42%,#2c0f0a 78%,#180705 100%);
    border:2px solid #bfa084;color:#ecdcC8;
    box-shadow:0 4px 12px #00000088,inset 0 1px 0 #ffffff22,inset 0 -9px 18px #00000066}
</style>
</head>
<body>
  <h2>攻击键样式候选 3（纯图标 · 不用文字 · 颜色压到和游戏同一个色系）</h2>
  <div class="sub">按实际大小 108px 显示，背景就是游戏里的废土色调；仍然全是纯 CSS + 内联 SVG，不加图片素材</div>

  <div class="wrap">
    <div class="cell">
      <div class="btn b1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
          <line x1="13" y1="19" x2="19" y2="13"/>
          <line x1="16" y1="16" x2="20" y2="20"/>
          <line x1="19" y1="21" x2="21" y2="19"/>
        </svg>
      </div>
      <div class="cap"><b>①</b> 锈铁圆扣<i>锈铁褐 + 一把剑</i></div>
    </div>

    <div class="cell">
      <div class="btn b2">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M6.5 5.5 24.5 26" stroke-width="2.8"/>
          <path d="M25.5 5.5 7.5 26" stroke-width="2.8"/>
          <path d="M4 25.5 8 29" stroke-width="3.6"/>
          <path d="M28 25.5 24 29" stroke-width="3.6"/>
        </svg>
      </div>
      <div class="cap"><b>②</b> 青铜令牌<i>青铜 + 交叉双剑</i></div>
    </div>

    <div class="cell">
      <div class="btn b3">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round">
          <path d="M7 5 Q12 15 10 27" stroke-width="3.6"/>
          <path d="M15 4 Q20 14 18 26" stroke-width="3"/>
          <path d="M23 6 Q27 14 25 23" stroke-width="2.4"/>
        </svg>
      </div>
      <div class="cap"><b>③</b> 灰绿玉璧<i>枯草绿 + 三道爪痕</i></div>
    </div>

    <div class="cell">
      <div class="btn b4">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round">
          <path d="M4 26C10 27 20 24 27 12" stroke-width="3.4"/>
          <path d="M7 18C13 20 20 17 25 8" stroke-width="2.2" opacity=".8"/>
        </svg>
      </div>
      <div class="cap"><b>④</b> 灰钢刀光<i>灰钢 + 两道刀光</i></div>
    </div>

    <div class="cell">
      <div class="btn b5">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round"
             stroke-linejoin="round">
          <line x1="17" y1="6" x2="17" y2="27" stroke-width="3"/>
          <path d="M17 7C10.5 7.5 6 11.5 5 16.5c4.5-1 8.5.5 12 3z" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="cap"><b>⑤</b> 暗血玉璧<i>干血褐 + 一把斧</i></div>
    </div>
  </div>
</body>
</html>
