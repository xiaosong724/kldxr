// ★ 第 178 轮：仓库换成国内镜像
//   原因：google() / mavenCentral() 在国内下载 AGP 和依赖经常超时 ✗
//   阿里云镜像和官方是同一份东西 ✓ 只是快很多 ✓
//   ★ 排序有讲究：镜像放前面，官方放后面兜底
//     （镜像里没有的东西，会自动回落到官方 ✓ 不会因为镜像缺包就编不过 ✓）
pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}
rootProject.name = "xiuxian2d"
include ':app'
